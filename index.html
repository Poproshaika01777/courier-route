<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#15171A" />
<script>(function(){try{var t=localStorage.getItem('courier-route-theme');var d=t==='dark'||(t!=='light'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');}catch(e){}})();</script>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>Today's Route</title>
<style>
  :root {
    --bg:#EEF0EC; --card:#fff; --card-done:#F6F7F5; --card-sel:#FFF3EC;
    --text:#15171A; --muted:#6B7280; --muted2:#7B8087;
    --line:#E3E5E0; --line2:#D9DCD6; --input-bg:#fff;
    --icon:#A5A9AE; --grip:#9EA3A9; --sel-icon:#B8BCC0; --check-bd:#C9CCD0;
    --accent:#FF6A13; --on-accent:#fff;
    --ok:#1F8A5F; --ok-soft:#E6F5ED; --ok-text:#157347; --ok-line:#CBE8D7;
    --warn-bg:#FFF1E8; --warn-line:#F8D9C4; --warn-text:#B4530A;
    --danger:#D64545; --danger-soft:#FDECEC;
    --hdr-bg:#15171A; --hdr-muted:#9CA0A6; --track:#2A2C30;
    --tb-bg:#1E2125; --tb-bd:#2F3237; --tb-text:#D3D5D8; --tb-on:#FF9A5C;
    --toast-bg:#15171A; --toast-act:#FF8A47;
    --bar-bg:#15171A; --sb-bg:#2A2D32; --bar-input-bg:#1E2125; --bar-input-bd:#3A3D42;
    --sheet-bg:#fff; --seg-bg:#EEF0EC; --cancel-text:#4B5563; --btn-bg:#fff;
    --shadow:rgba(0,0,0,.25);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg:#0E0F11; --card:#1A1C20; --card-done:#141619; --card-sel:#2A1D14;
    --text:#ECEDEF; --muted:#9AA0A8; --muted2:#8A9098;
    --line:#2A2D33; --line2:#363A41; --input-bg:#1F2227;
    --icon:#7D838C; --grip:#8A9099; --sel-icon:#5E646C; --check-bd:#4C515A;
    --ok-soft:#14291F; --ok-text:#5CD39B; --ok-line:#1F4332;
    --warn-bg:#2B1D13; --warn-line:#4A2F1D; --warn-text:#FFA45C;
    --danger:#E15A5A; --danger-soft:#3A1E1F;
    --hdr-bg:#17191D; --track:#2C3036;
    --tb-bg:#22262B; --tb-bd:#33383F;
    --toast-bg:#2C3037;
    --bar-bg:#17191D; --sb-bg:#2A2E34; --bar-input-bg:#1F2227; --bar-input-bd:#3A3F46;
    --sheet-bg:#1A1C20; --seg-bg:#0E0F11; --cancel-text:#C3C7CD; --btn-bg:#22262B;
    --shadow:rgba(0,0,0,.6);
    color-scheme: dark;
  }

  html, body { margin:0; padding:0; background:var(--bg); overscroll-behavior:none; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, Arial, sans-serif; color:var(--text); -webkit-text-size-adjust:100%; }
  body.is-dragging { -webkit-user-select:none; user-select:none; }
  input, textarea, button { font-family: inherit; color:inherit; }
  ::placeholder { color:var(--muted2); opacity:1; }
  .bc { font-family: 'Arial Narrow', Arial, sans-serif; font-stretch: condensed; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  textarea { -webkit-appearance: none; }
  #app { max-width: 440px; margin: 0 auto; min-height: 100vh; display:flex; flex-direction:column; }

  /* ---------- header ---------- */
  .header { background:var(--hdr-bg); color:#fff; padding:calc(14px + env(safe-area-inset-top, 0px)) 16px 14px; border-radius:0 0 20px 20px; }
  .topbar { display:flex; justify-content:space-between; align-items:center; min-height:36px; }
  .top-actions { display:flex; gap:8px; }
  .icon-btn { width:36px; height:36px; border-radius:50%; border:1px solid var(--tb-bd); background:var(--tb-bg); color:var(--tb-text); display:flex; align-items:center; justify-content:center; padding:0; }
  .icon-btn svg { width:18px; height:18px; }
  .header-top { display:flex; justify-content:space-between; align-items:flex-end; margin-top:2px; }
  .date { font-size:13px; letter-spacing:.3px; color:var(--hdr-muted); }
  .title { font-size:29px; font-weight:700; line-height:1.05; }
  .title { min-width:0; }
  html[lang="ru"] .title { font-size:25px; }
  .counter { text-align:right; line-height:1; flex-shrink:0; margin-left:10px; }
  .counter .big { font-size:32px; font-weight:700; color:var(--accent); }
  .counter .of { font-size:18px; color:var(--hdr-muted); }
  .counter .lbl { font-size:11px; color:var(--hdr-muted); margin-top:3px; letter-spacing:.3px; }
  .progress-track { height:6px; background:var(--track); border-radius:3px; overflow:hidden; margin-top:12px; }
  .progress-fill { height:100%; background:var(--accent); border-radius:3px; transition:width 200ms ease; }
  .toolbar { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin-top:14px; }
  .tb { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:9px 2px 7px; border-radius:12px; border:1px solid var(--tb-bd); background:var(--tb-bg); color:var(--tb-text); font-size:11.5px; min-width:0; }
  .tb span { max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tb svg { width:18px; height:18px; }
  .tb.on { border-color:var(--accent); color:var(--tb-on); }
  .tb.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .tb:disabled { opacity:.4; }

  /* ---------- banners ---------- */
  .banner { margin:10px 12px 0; border-radius:12px; padding:10px 12px; font-size:13px; display:flex; align-items:flex-start; gap:8px; }
  .banner button { background:none; border:none; color:var(--muted); flex-shrink:0; padding:2px; display:flex; }
  .banner.info { background:var(--ok-soft); border:1px solid var(--ok-line); }
  .banner.error { background:var(--warn-bg); border:1px solid var(--warn-line); }
  .banner.confirm { background:var(--warn-bg); border:1px solid var(--warn-line); flex-direction:column; align-items:stretch; }
  .confirm-title { font-size:14px; margin-bottom:8px; }
  .confirm-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .confirm-actions button { font-size:13px; padding:8px 12px; border-radius:9px; border:1px solid var(--line); background:var(--btn-bg); color:var(--text); }
  .confirm-actions .danger { border:none; background:var(--danger); color:#fff; }
  .confirm-actions .ghost { margin-left:auto; display:flex; align-items:center; }

  /* ---------- auto-sort card ---------- */
  .sort-card { margin:12px 12px 0; }
  .sort-line { display:flex; gap:8px; }
  .sort-btn { flex:1; padding:13px 12px; border-radius:13px; border:none; background:var(--accent); color:#fff; font-size:14px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:7px; }
  .sort-btn:disabled { opacity:.85; }
  .cancel-btn { padding:0 16px; border-radius:13px; border:1px solid var(--line2); background:var(--btn-bg); color:var(--cancel-text); font-size:13.5px; flex-shrink:0; }
  .link-btn { background:none; border:none; color:var(--muted); font-size:12.5px; padding:9px 2px 0; text-decoration:underline; text-underline-offset:2px; text-align:left; }
  .start-input { width:100%; padding:11px 12px; border-radius:12px; border:1px solid var(--line2); background:var(--input-bg); color:var(--text); font-size:14px; margin-top:8px; outline:none; }
  .start-input:focus { border-color:var(--accent); }
  .spinner { width:14px; height:14px; border:2px solid #ffffff55; border-top-color:#fff; border-radius:50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .select-toolbar { display:flex; align-items:center; justify-content:space-between; margin:10px 12px 0; padding:10px 14px; background:var(--card); border:1px solid var(--line); border-radius:12px; }
  .select-toolbar button { font-size:13.5px; font-weight:600; color:var(--accent); background:none; border:none; padding:0; }
  .select-count { font-size:13px; color:var(--muted); }
  .hint { margin:12px 16px 2px; font-size:12px; color:var(--muted2); }

  /* ---------- list & rows ---------- */
  .list { flex:1; padding:8px 12px 0; }
  .empty { text-align:center; color:var(--muted); padding:60px 24px; }
  .empty svg { margin:0 auto 10px; opacity:.5; }
  .empty .h { font-size:15px; margin-bottom:4px; }
  .empty .s { font-size:13px; }

  .row { display:flex; align-items:stretch; background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:8px; position:relative; touch-action:pan-y; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .row.next { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .row.delivered { background:var(--card-done); }
  .row.delivered .body { opacity:.55; }
  .row.selected { background:var(--card-sel); border-color:var(--accent); }
  .row.shifting { transition: transform .16s ease; }
  .row.dragging { z-index:20; border-color:var(--accent); box-shadow:0 12px 30px var(--shadow); transition:none; }

  .move-col { display:flex; flex-direction:column; align-items:center; justify-content:space-between; width:40px; padding:4px 0; flex-shrink:0; }
  .move-btn { width:100%; height:26px; display:flex; align-items:center; justify-content:center; color:var(--icon); background:none; border:none; padding:0; }
  .move-btn:disabled { opacity:.25; }
  .grip { flex:1; width:100%; min-height:28px; display:flex; align-items:center; justify-content:center; color:var(--grip); touch-action:none; cursor:grab; }
  .row.compact .move-btn { display:none; }
  .row.selmode .body { padding-right:14px; }
  .sel-box { width:42px; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:var(--sel-icon); }
  .sel-box.checked { color:var(--accent); }

  .body { flex:1; min-width:0; padding:10px 0 10px 2px; }
  .meta { display:flex; align-items:center; gap:7px; margin-bottom:5px; min-height:22px; flex-wrap:wrap; }
  .num { display:inline-flex; align-items:center; justify-content:center; min-width:26px; height:22px; padding:0 8px; border-radius:7px; background:var(--accent); color:#fff; font-size:14px; font-weight:700; cursor:pointer; }
  .num.done { background:var(--ok); }
  .tag-next { font-size:10.5px; font-weight:700; letter-spacing:.6px; color:var(--accent); }
  .geo-warn { font-size:11.5px; color:var(--warn-text); }
  .pos-input { width:46px; height:24px; text-align:center; font-size:14px; font-weight:700; border:1.5px solid var(--accent); border-radius:7px; outline:none; color:var(--accent); background:var(--input-bg); padding:0; }
  .text { font-size:14px; line-height:1.42; white-space:pre-line; word-break:break-word; }
  .text.delivered { text-decoration:line-through; color:var(--muted); }
  .row.compact .text { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; white-space:normal; }
  .phone-link { color:var(--accent); text-decoration:underline; text-underline-offset:2px; }
  .c-body { padding:8px 0 8px 2px; display:flex; align-items:center; }
  .c-line { display:flex; align-items:center; gap:8px; width:100%; }
  .c-line .text { flex:1; min-width:0; }
  .wa-btn { flex-shrink:0; width:32px; height:32px; border-radius:50%; background:var(--ok-soft); color:var(--ok-text); display:flex; align-items:center; justify-content:center; text-decoration:none; }

  .edit-box { width:100%; font-size:14px; line-height:1.4; padding:8px 10px; border:1.5px solid var(--accent); border-radius:10px; outline:none; resize:vertical; background:var(--input-bg); color:var(--text); -webkit-user-select:text; user-select:text; }
  .edit-actions { display:flex; gap:8px; margin-top:8px; padding-right:2px; }
  .ea { flex:1; padding:10px; border-radius:10px; border:none; font-size:13.5px; font-weight:600; }
  .ea-delete { background:var(--danger-soft); color:var(--danger); }
  .ea-done { background:var(--text); color:var(--card); }

  .act-col { width:48px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:6px 0; }
  .cam-btn { width:34px; height:34px; flex-shrink:0; border-radius:50%; border:none; background:var(--seg-bg); color:var(--muted); display:flex; align-items:center; justify-content:center; padding:0; }
  .cam-btn svg { width:17px; height:17px; }
  .c-line .cam-btn { width:32px; height:32px; }
  .check-btn { width:40px; height:40px; flex-shrink:0; border:none; background:none; display:flex; align-items:center; justify-content:center; padding:0; }
  .check-circle { width:32px; height:32px; border-radius:50%; border:2px solid var(--check-bd); display:flex; align-items:center; justify-content:center; color:var(--check-bd); }
  .check-btn.done .check-circle { background:var(--ok); border-color:var(--ok); color:#fff; }

  /* ---------- bottom area ---------- */
  .bottom-fixed { position:fixed; bottom:0; left:0; right:0; display:flex; flex-direction:column; align-items:center; pointer-events:none; }
  .bottom-fixed > * { pointer-events:auto; }
  .toast { width:calc(100% - 24px); max-width:416px; margin:0 0 10px; background:var(--toast-bg); color:#fff; border-radius:13px; padding:10px 8px 10px 14px; display:flex; align-items:center; gap:10px; font-size:13.5px; box-shadow:0 8px 24px var(--shadow); }
  .toast button { margin-left:auto; background:none; border:none; color:var(--toast-act); font-weight:700; font-size:14px; padding:6px 10px; flex-shrink:0; }
  .add-wrap { background:linear-gradient(0deg, var(--bg) 62%, transparent); padding-top:18px; width:100%; display:flex; justify-content:center; }
  .add-inner { width:100%; max-width:440px; padding:0 12px calc(12px + env(safe-area-inset-bottom, 0px)); }
  .add-bar { background:var(--card); border:1px solid var(--line2); border-radius:14px; padding:8px 8px 8px 14px; display:flex; align-items:flex-end; gap:8px; box-shadow:0 4px 16px var(--shadow); }
  .add-bar textarea { flex:1; border:none; outline:none; resize:none; font-size:14px; padding:7px 0; max-height:160px; overflow-y:auto; background:transparent; color:var(--text); }
  .add-btn { width:40px; height:40px; border-radius:11px; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; border:none; }

  .sel-bar { width:100%; max-width:440px; background:var(--bar-bg); padding:10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); border-radius:18px 18px 0 0; }
  .sel-row { display:flex; gap:8px; }
  .sel-row + .sel-row { margin-top:8px; }
  .sb { flex:1; padding:12px 6px; border-radius:11px; border:none; color:#fff; font-size:13px; font-weight:600; background:var(--sb-bg); display:flex; align-items:center; justify-content:center; gap:5px; min-width:0; }
  .sb:disabled { opacity:.4; }
  .sb.deliver { background:var(--ok); }
  .sb.del { background:var(--danger); }
  .moveto { display:flex; flex:1.5; gap:6px; }
  .moveto input { flex:1; min-width:0; width:100%; padding:0 8px; border-radius:11px; border:1px solid var(--bar-input-bd); background:var(--bar-input-bg); color:#fff; font-size:15px; text-align:center; outline:none; }
  .moveto input:focus { border-color:var(--accent); }
  .moveto .sb { flex:0 0 auto; padding:12px 14px; }

  /* ---------- photo sheet ---------- */
  .photo-prev { width:100%; max-height:44vh; object-fit:contain; border-radius:12px; background:#000; margin-top:14px; display:block; }
  .photo-cap { font-size:13.5px; margin-top:10px; white-space:pre-line; word-break:break-word; }
  .photo-hint { font-size:12.5px; color:var(--muted); margin-top:8px; }
  .photo-note { font-size:12.5px; color:var(--warn-text); margin-top:8px; }
  .photo-wait { display:flex; align-items:center; gap:10px; padding:28px 4px 18px; color:var(--muted); font-size:14px; }
  .spinner.dark { border-color:var(--line2); border-top-color:var(--accent); }
  .photo-actions { display:flex; gap:10px; margin-top:14px; }
  .ph-btn { flex:1; padding:14px 10px; border-radius:13px; border:none; font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px; min-width:0; }
  .ph-btn svg { width:18px; height:18px; }
  .ph-btn.ghost { background:var(--seg-bg); color:var(--text); flex:0.8; }
  .ph-btn.primary { background:var(--ok); color:#fff; flex:1.4; }

  /* ---------- settings sheet ---------- */
  .sheet-wrap { position:fixed; inset:0; z-index:100; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; }
  .sheet-backdrop { position:absolute; inset:0; background:rgba(0,0,0,.5); }
  .sheet { position:relative; width:100%; max-width:440px; background:var(--sheet-bg); color:var(--text); border-radius:20px 20px 0 0; padding:18px 16px calc(20px + env(safe-area-inset-bottom, 0px)); box-shadow:0 -10px 40px var(--shadow); }
  .sheet-head { display:flex; justify-content:space-between; align-items:center; }
  .sheet-title { font-size:19px; font-weight:700; }
  .sheet-close { width:34px; height:34px; border-radius:50%; border:none; background:var(--seg-bg); color:var(--muted); display:flex; align-items:center; justify-content:center; padding:0; }
  .set-label { font-size:12.5px; color:var(--muted); margin:18px 0 8px; letter-spacing:.2px; }
  .seg { display:flex; background:var(--seg-bg); border-radius:13px; padding:3px; gap:3px; }
  .seg button { flex:1; padding:11px 6px; border:none; border-radius:10px; background:none; color:var(--text); font-size:14px; font-weight:600; min-width:0; }
  .seg button.on { background:var(--accent); color:#fff; }
</style>
</head>

      kk: ["қаңтар", "ақпан", "наурыз", "сәуір", "мамыр", "маусым", "шілде", "тамыз", "қыркүйек", "қазан", "қараша", "желтоқсан"]
    };
    var L = DAYS[state.lang] ? state.lang : "en";
    var d = new Date();
    var text = L === "en"
      ? DAYS.en[d.getDay()] + ", " + MONTHS.en[d.getMonth()] + " " + d.getDate()
      : DAYS[L][d.getDay()] + ", " + d.getDate() + " " + MONTHS[L][d.getMonth()];
    return text.charAt(0).toUpperCase() + text.slice(1);
  }
  function splitIntoStops(raw) {
    return raw.split(/\n\s*\n+/).map(function (b) { return b.trim(); }).filter(Boolean);
  }
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // Finds phone-number-like sequences in already-escaped text and wraps
  // them in a tappable WhatsApp link. Runs after escapeHtml, so it only
  // ever sees digits/spaces/+/-/()/plain text — safe to inject <a> tags.
  var PHONE_RE = /(\+?\d[\d \t\u00a0\-()]{7,}\d)/g;

  function normalizeToWaNumber(raw) {
    var digits = raw.replace(/\D/g, "");
    if (digits.length === 11 && digits[0] === "8") {
      digits = "7" + digits.slice(1); // KZ/RU local trunk prefix -> country code
    }
    return digits;
  }

  function linkifyPhones(escapedText) {
    return escapedText.replace(PHONE_RE, function (match) {
      var digits = normalizeToWaNumber(match);
      if (digits.length < 9) return match; // too short to be a real phone number
      return '<a href="https://wa.me/' + digits + '" target="_blank" rel="noopener noreferrer" data-phone-link class="phone-link">' + match + '</a>';
    });
  }

  var app = document.getElementById("app");

  // ---- small helpers used by the UI ----
  var undoTimer = null;

  function pushUndo(label) {
    state.undo = { label: label, snap: JSON.stringify(state.items) };
    clearTimeout(undoTimer);
    undoTimer = setTimeout(function () {
      state.undo = null;
      var toastEl = document.getElementById("toast");
      if (toastEl && toastEl.parentNode) toastEl.parentNode.removeChild(toastEl);
    }, 7000);
  }

  function undoLast() {
    if (!state.undo || state.undo.kind === "deliver") return;
    try { state.items = JSON.parse(state.undo.snap); } catch (e) {}
    state.undo = null;
    clearTimeout(undoTimer);
    state.selectedIds = {};
    state.selectMode = false;
    state.editingId = null;
    saveItems();
    render();
  }

  // ---- photo -> share sheet (WhatsApp group, client chat, ...) ----
  function photoCaption(idx) {
    return (idx + 1) + ". " + state.items[idx].text.split("\n")[0].trim();
  }

  // Phone photos are several MB; shrink to ~1600px JPEG so sending is quick on mobile data.
  function prepPhoto(file) {
    return new Promise(function (resolve) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        try {
          var scale = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
          var c = document.createElement("canvas");
          c.width = Math.max(1, Math.round(img.naturalWidth * scale));
          c.height = Math.max(1, Math.round(img.naturalHeight * scale));
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          c.toBlob(function (blob) { URL.revokeObjectURL(url); resolve(blob || file); }, "image/jpeg", 0.85);
        } catch (e) { URL.revokeObjectURL(url); resolve(file); }
      };
      img.onerror = function () { URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

  function canShareFile(file) {
    try { return !!(file && navigator.share && navigator.canShare && navigator.canShare({ files: [file] })); }
    catch (e) { return false; }
  }

  function discardPhoto() {
    if (state.photo && state.photo.url) { try { URL.revokeObjectURL(state.photo.url); } catch (e) {} }
    state.photo = null;
  }

  function closePhoto() {
    discardPhoto();
    render();
  }

  function startPhoto(id) {
    var input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";
    input.setAttribute("capture", "environment");
    input.style.display = "none";
    function cleanup() { if (input.parentNode) input.parentNode.removeChild(input); }
    input.addEventListener("change", function () {
      var f = input.files && input.files[0];
      cleanup();
      if (!f) return;
      var idx = state.items.findIndex(function (it) { return it.id === id; });
      if (idx < 0) return;
      discardPhoto();
      state.photo = { id: id, processing: true, caption: photoCaption(idx), name: "stop-" + (idx + 1) + ".jpg", file: null, url: null, error: null };
      render();
      prepPhoto(f).then(function (blob) {
        if (!state.photo || state.photo.id !== id || !state.photo.processing) return;
        var file = new File([blob], state.photo.name, { type: "image/jpeg" });
        state.photo.file = file;
        state.photo.url = URL.createObjectURL(file);
        state.photo.processing = false;
        render();
      });
    });
    input.addEventListener("cancel", cleanup);
    document.body.appendChild(input);
    input.click();
  }

  function retakePhoto() {
    var id = state.photo && state.photo.id;
    discardPhoto();
    render();
    if (id) startPhoto(id);
  }

  function downloadPhoto() {
    var ph = state.photo;
    if (!ph || !ph.url) return;
    var a = document.createElement("a");
    a.href = ph.url;
    a.download = ph.name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  // Must run straight from a tap (browsers only allow sharing then), so it is a separate step after the preview.
  function sharePhoto() {
    var ph = state.photo;
    if (!ph || !ph.file) return;
    if (!canShareFile(ph.file)) { downloadPhoto(); return; }
    var id = ph.id;
    navigator.share({ files: [ph.file], text: ph.caption }).then(function () {
      discardPhoto();
      promptDeliver(id);
      render();
    }).catch(function (err) {
      if (err && err.name === "AbortError") return; // closed the share list without sending
      if (state.photo) { state.photo.error = t("shareFailed"); render(); }
    });
  }

  function promptDeliver(id) {
    var it = state.items.find(function (x) { return x.id === id; });
    if (!it || it.delivered) return;
    state.undo = { label: t("deliverPrompt"), kind: "deliver", id: id };
    clearTimeout(undoTimer);
    undoTimer = setTimeout(function () {
      state.undo = null;
      var toastEl = document.getElementById("toast");
      if (toastEl && toastEl.parentNode) toastEl.parentNode.removeChild(toastEl);
    }, 9000);
  }

  function deliverFromToast() {
    var u = state.undo;
    if (!u || u.kind !== "deliver") return;
    state.undo = null;
    clearTimeout(undoTimer);
    state.items = state.items.map(function (it) { return it.id === u.id ? Object.assign({}, it, { delivered: true }) : it; });
    saveItems();
    render();
  }

  function toggleCompact() {

  // First phone number found anywhere in a stop (used for the compact view).
  function firstPhone(text) {
    var m = text.match(/(\+?\d[\d \t\u00a0\-()]{7,}\d)/);
    if (!m) return null;
    var digits = normalizeToWaNumber(m[0]);
    return digits.length >= 9 ? { label: m[0].trim(), digits: digits } : null;
  }

  function moveSelected(where) {
    var ids = state.selectedIds;

    if (!sel.length) return;
    var rest = state.items.filter(function (it) { return !ids[it.id]; });
    var at;
    if (where === "top") {
      at = 0;
    } else if (where === "bottom") {
      at = rest.length;
    } else {
      var input = document.getElementById("move-to-input");
      var n = parseInt(input ? input.value : state.moveTo, 10);
      if (!n || isNaN(n)) {
        state.sortError = t("movePosError");
        render();
        return;
      }
      at = Math.max(0, Math.min(rest.length, n - 1));
    }
    var label = where === "top" ? tn("undoMovedTop", sel.length, { n: sel.length })
      : where === "bottom" ? tn("undoMovedBottom", sel.length, { n: sel.length })
      : tn("undoMovedPos", sel.length, { n: sel.length, p: at + 1 });
    pushUndo(label);
    state.items = rest.slice(0, at).concat(sel, rest.slice(at));
    state.selectedIds = {};
    state.selectMode = false;
    state.moveTo = "";
    saveItems();
    render();
  }

  // ---- actions ----
  function addStops() {
    var blocks = splitIntoStops(state.draft);
    if (blocks.length === 0) return;
    blocks.forEach(function (text) {
      state.items.push({ id: uid(), text: text, delivered: false });
    });
    state.draft = "";
    saveItems();
    render();
  }

  function toggleDelivered(id) {
    state.items = state.items.map(function (it) {
      return it.id === id ? Object.assign({}, it, { delivered: !it.delivered }) : it;
    });
    saveItems();
    render();
  }

  function deleteItem(id) {
    pushUndo(t("undoStopDeleted"));
    state.items = state.items.filter(function (it) { return it.id !== id; });
    state.editingId = null;
    saveItems();
    render();
  }

  function startEdit(id) {
    if (state.editingId === id) return;
    if (state.editingId !== null) commitEdit();
    var it = state.items.find(function (i) { return i.id === id; });
    if (!it) return;
    state.editingId = id;
    state.editText = it.text;
    render();
  }

  function commitEdit() {
    if (state.editingId === null) return;
    state.items = state.items.map(function (it) {
      return it.id === state.editingId ? Object.assign({}, it, { text: state.editText.trim() || it.text }) : it;
    });
    state.editingId = null;
    saveItems();
    render();
  }

  function moveItem(id, delta) {
    var index = state.items.findIndex(function (it) { return it.id === id; });
    if (index === -1) return;
    var newIndex = Math.max(0, Math.min(state.items.length - 1, index + delta));
    if (newIndex === index) return;
    var arr = state.items.slice();
    var moved = arr.splice(index, 1)[0];
    arr.splice(newIndex, 0, moved);
    state.items = arr;
    saveItems();
    render();
  }

  function startPositionEdit(id) {
    state.editingPositionId = id;
    render();
  }

  function commitPositionEdit(id, rawValue) {
    state.editingPositionId = null;
    var index = state.items.findIndex(function (it) { return it.id === id; });
    if (index === -1) { render(); return; }
    var target = parseInt(rawValue, 10);
    if (!target || isNaN(target)) { render(); return; }
    var newIndex = Math.max(0, Math.min(state.items.length - 1, target - 1));
    if (newIndex === index) { render(); return; }
    var arr = state.items.slice();
    var moved = arr.splice(index, 1)[0];
    arr.splice(newIndex, 0, moved);
    state.items = arr;
    saveItems();
    render();
  }

  function buildNumberedText() {
    return state.items
      .map(function (it, idx) { return (idx + 1) + ".\n" + it.text; })
      .join("\n\n");
  }

  function showCopyFeedback() {
    state.copyFeedback = true;
    render();
    setTimeout(function () {
      state.copyFeedback = false;
      render();
    }, 1500);
  }

  function copyList() {
    if (state.items.length === 0) return;
    var text = buildNumberedText();

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(showCopyFeedback).catch(function () {
        fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
      document.execCommand("copy");
      showCopyFeedback();
    } catch (e) {
      window.prompt(t("manualCopy"), text);
    }
    document.body.removeChild(ta);
  }

  function resetRoute() {
    pushUndo(t("undoRouteCleared"));
    state.items = [];
    state.confirmClear = false;
    saveItems();
    render();
  }

  function clearDelivered() {
    pushUndo(t("undoDeliveredRemoved"));
    state.items = state.items.filter(function (it) { return !it.delivered; });
    state.confirmClear = false;
    saveItems();
    render();
  }

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function getCurrentPosition() {
    return new Promise(function (resolve, reject) {
      if (!navigator.geolocation) { reject(new Error("no geolocation")); return; }
      navigator.geolocation.getCurrentPosition(
        function (pos) { resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }); },
        function (err) { reject(err); },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
      );
    });
  }

  function haversineKm(a, b) {
    var R = 6371;
    var dLat = (b.lat - a.lat) * Math.PI / 180;
    var dLon = (b.lon - a.lon) * Math.PI / 180;
    var lat1 = a.lat * Math.PI / 180, lat2 = b.lat * Math.PI / 180;
    var x = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.sin(dLon / 2) * Math.sin(dLon / 2) * Math.cos(lat1) * Math.cos(lat2);
    return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
  }

  function reverseGeocodeCity(coords) {
    var url = "https://nominatim.openstreetmap.org/reverse?format=json&lat=" + coords.lat + "&lon=" + coords.lon;
    return fetch(url, { headers: { "Accept-Language": "ru" } })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        var addr = data && data.address;
        if (!addr) return "";
        var city = addr.city || addr.town || addr.village || addr.state || "";
        var country = addr.country || "";
        return [city, country].filter(Boolean).join(", ");
      })
      .catch(function () { return ""; });
  }

  // Pulls out "street name + house number" fragments from a messy first
  // line like "ЖК La Verde, Жамакаева 252, блок7, кв 88" so the geocoder
  // gets something closer to a real postal address instead of the whole
  // noisy line. Tolerates a comma between name and number, and a "дом"
  // marker, and skips false hits like "подъезд 1" or "этаж 6".
  var BLOCKLIST_WORDS = ["подъезд", "этаж", "кв", "квартира", "блок", "корпус", "код", "домофон", "калитка", "калитки", "этаже", "офис"];
  var STREET_NUM_RE = /([А-ЯЁ][А-Яа-яЁё\-]*(?:\s+[А-ЯЁ][А-Яа-яЁё\-]*)*)\s*,?\s*(?:дом\s+|д\.\s*)?(\d+[a-zA-Zа-яА-Я]?(?:\/\d+)?)/g;

  function extractQueryCandidates(fullText) {
    var firstLine = fullText.split("\n")[0].trim();
    var candidates = [];
    var m;
    STREET_NUM_RE.lastIndex = 0;
    while ((m = STREET_NUM_RE.exec(firstLine)) !== null) {
      var words = m[1].trim().split(/\s+/);
      var lastWord = words[words.length - 1].toLowerCase();
      if (BLOCKLIST_WORDS.indexOf(lastWord) !== -1) continue;
      var candidate = (m[1] + " " + m[2]).trim();
      if (candidate !== firstLine) candidates.push(candidate);
    }
    candidates.push(firstLine);
    return candidates;
  }

  function geocodeAddress(fullText, cityHint) {
    var candidates = extractQueryCandidates(fullText);

    function tryCandidate(i) {
      if (i >= candidates.length) return Promise.resolve(null);
      var query = cityHint ? candidates[i] + ", " + cityHint : candidates[i];
      var url = "https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=3&q=" + encodeURIComponent(query);
      return fetch(url, { headers: { "Accept-Language": "ru" } })
        .then(function (res) { return res.json(); })
        .then(function (results) {
          if (results && results.length) {
            // Prefer a result that actually matched a house number over
            // a loose match on just the street/area name.
            var best = results.find(function (r) { return r.address && r.address.house_number; }) || results[0];
            return { lat: parseFloat(best.lat), lon: parseFloat(best.lon) };
          }
          if (i + 1 < candidates.length) {
            return sleep(1100).then(function () { return tryCandidate(i + 1); });
          }
          return null;
        })
        .catch(function () {
          if (i + 1 < candidates.length) {
            return sleep(1100).then(function () { return tryCandidate(i + 1); });
          }
          return null;
        });
    }

    return tryCandidate(0);
  }

  function getOrigin() {
    var startText = (state.startFrom || "").trim();
    if (!startText) {
      state.sortStatus = t("stGetLoc");
      render();
      return getCurrentPosition();
    }
    state.sortStatus = t("stLocStart");
    render();
    return geocodeAddress(startText, "").then(function (coords) {
      if (!coords) {
        var err = new Error("start-not-found");
        err.code = "start-not-found";
        throw err;
      }
      return coords;
    });
  }

  function firstLineKey(text) { return text.split("\n")[0].trim(); }

  // A stop keeps its map position once found, so re-sorting is instant.
  // The saved position is only reused while its address line is unchanged.
  function cachedCoords(it) {
    if (it.geo && !it.geo.failed && it.geo.key === firstLineKey(it.text)) {
      return { lat: it.geo.lat, lon: it.geo.lon };
    }
    return null;
  }

  function setGeo(id, geo) {
    state.items = state.items.map(function (it) {
      return it.id === id ? Object.assign({}, it, { geo: geo }) : it;
    });
    saveItems();
  }

  function pathLengthKm(origin, route) {
    var total = 0, cur = origin;
    for (var i = 0; i < route.length; i++) {
      total += haversineKm(cur, route[i].coords);
      cur = route[i].coords;
    }
    return total;
  }

  function nearestNeighbor(origin, stops) {
    var remaining = stops.slice();
    var route = [];
    var current = origin;
    while (remaining.length) {
      var bestIdx = 0, bestDist = Infinity;
      for (var i = 0; i < remaining.length; i++) {
        var d = haversineKm(current, remaining[i].coords);
        if (d < bestDist) { bestDist = d; bestIdx = i; }
      }
      var chosen = remaining.splice(bestIdx, 1)[0];
      route.push(chosen);
      current = chosen.coords;
    }
    return route;
  }

  // 2-opt: keep reversing stretches of the route while that makes the whole
  // trip shorter. Fixes the "zig-zag" mistakes nearest-neighbour leaves behind.
  // The start point stays fixed and the route ends wherever it ends.
  function twoOpt(origin, route) {
    var best = route.slice();
    var improved = true, rounds = 0;
    while (improved && rounds < 60) {
      improved = false;
      rounds++;
      for (var i = 0; i < best.length - 1; i++) {
        for (var j = i + 1; j < best.length; j++) {
          var prev = i === 0 ? origin : best[i - 1].coords;
          var a = best[i].coords, b = best[j].coords;
          var next = j + 1 < best.length ? best[j + 1].coords : null;
          var before = haversineKm(prev, a) + (next ? haversineKm(b, next) : 0);
          var after = haversineKm(prev, b) + (next ? haversineKm(a, next) : 0);
          if (after < before - 1e-9) {
            best = best.slice(0, i).concat(best.slice(i, j + 1).reverse(), best.slice(j + 1));
            improved = true;
          }
        }
      }
    }
    return best;
  }

  function applyOrder(origin) {
    var pending = state.items.filter(function (it) { return !it.delivered; });
    var delivered = state.items.filter(function (it) { return it.delivered; });
    var located = [], unlocated = [];
    pending.forEach(function (it) {
      var c = cachedCoords(it);
      if (c) located.push({ item: it, coords: c }); else unlocated.push(it);
    });

    var route = twoOpt(origin, nearestNeighbor(origin, located));
    var km = pathLengthKm(origin, route);

    pushUndo(t("undoSorted"));
    state.items = route.map(function (r) { return r.item; }).concat(unlocated, delivered);
    state.sorting = false;
    state.sortStatus = "";
    state.sortInfo = tn("sortedInfo", route.length, { n: route.length, km: km.toFixed(1) }) + (delivered.length ? t("deliveredNote") : "");
    if (unlocated.length) {
      state.sortError = tn("unlocated", unlocated.length, { n: unlocated.length });
    }
    saveItems();
    render();
  }

  function sortByLocation() {
    if (state.sorting) return;
    var pendingCount = state.items.filter(function (it) { return !it.delivered; }).length;
    if (pendingCount < 2) {
      state.sortError = t("needTwo");
      render();
      return;
    }
    state.sorting = true;
    state.cancelSort = false;
    state.sortError = null;
    state.sortInfo = null;
    render();

    function finishCancelled() {
      state.sorting = false;
      state.sortStatus = "";
      state.sortInfo = t("cancelled");
      render();
    }

    var usedStartAddress = !!(state.startFrom || "").trim();

    getOrigin().then(function (origin) {
      if (state.cancelSort) { finishCancelled(); return; }

      var toLocate = state.items.filter(function (it) { return !it.delivered && !cachedCoords(it); });

      var cityStep = Promise.resolve("");
      if (toLocate.length) {
        state.sortStatus = t("stArea");
        render();
        cityStep = (usedStartAddress ? sleep(1100) : Promise.resolve())
          .then(function () { return reverseGeocodeCity(origin); })
          .then(function (city) { return sleep(1100).then(function () { return city; }); });
      }

      return cityStep.then(function (city) {
        function next(i) {
          if (i >= toLocate.length || state.cancelSort) return Promise.resolve();
          state.sortStatus = t("stStop", { i: i + 1, n: toLocate.length });
          render();
          var it = toLocate[i];
          var key = firstLineKey(it.text);
          return geocodeAddress(it.text, city).then(function (coords) {
            setGeo(it.id, coords ? { key: key, lat: coords.lat, lon: coords.lon } : { key: key, failed: true });
            if (i + 1 >= toLocate.length) return next(i + 1);
            return sleep(1100).then(function () { return next(i + 1); });
          });
        }

        return next(0).then(function () {
          if (state.cancelSort) { finishCancelled(); return; }
          state.sortStatus = t("stOrder");
          render();
          applyOrder(origin);
        });
      });
    }).catch(function (err) {
      state.sorting = false;
      state.sortStatus = "";
      if (err && err.code === "start-not-found") {
        state.sortError = t("startNotFound");
      } else {
        state.sortError = t("mapFail");
      }
      render();
    });
  }

  function toggleSelectMode() {
    state.selectMode = !state.selectMode;
    state.selectedIds = {};
    render();
  }

  function toggleSelected(id) {
    if (state.selectedIds[id]) delete state.selectedIds[id];
    else state.selectedIds[id] = true;
    render();
  }

  function selectAll() {
    var allSelected = Object.keys(state.selectedIds).length === state.items.length && state.items.length > 0;
    if (allSelected) {
      state.selectedIds = {};
    } else {
      state.selectedIds = {};
      state.items.forEach(function (it) { state.selectedIds[it.id] = true; });
    }
    render();
  }

  function deleteSelected() {
    var count = Object.keys(state.selectedIds).length;
    pushUndo(tn("undoDeleted", count, { n: count }));
    state.items = state.items.filter(function (it) { return !state.selectedIds[it.id]; });
    state.selectedIds = {};
    state.selectMode = false;
    saveItems();
    render();
  }

  function markSelectedDelivered() {
    var count = Object.keys(state.selectedIds).length;
    pushUndo(tn("undoMarked", count, { n: count }));
    state.items = state.items.map(function (it) {
      return state.selectedIds[it.id] ? Object.assign({}, it, { delivered: true }) : it;
    });
    state.selectedIds = {};
    state.selectMode = false;
    saveItems();
    render();
  }

  // ---- click delegation ----
  var suppressClickUntil = 0;

  app.addEventListener("click", function (e) {
    if (Date.now() < suppressClickUntil) return;        // click that ends a drag
    if (e.target.closest("[data-phone-link]")) return;  // let WhatsApp links open
    if (e.target.closest("[data-edit-box]")) return;    // taps inside the text box
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");
    var id = el.getAttribute("data-id");
    var value = el.getAttribute("data-value");
    switch (action) {
      case "toggle-select-mode": toggleSelectMode(); break;
      case "toggle-compact": toggleCompact(); break;
      case "copy-list": copyList(); break;
      case "undo": undoLast(); break;
      case "take-photo": startPhoto(id); break;
      case "close-photo": closePhoto(); break;
      case "retake-photo": retakePhoto(); break;
      case "share-photo": sharePhoto(); break;
      case "toast-deliver": deliverFromToast(); break;
      case "quick-theme": setTheme(resolvedTheme() === "dark" ? "light" : "dark"); break;
      case "open-settings": state.showSettings = true; render(); break;
      case "close-settings": state.showSettings = false; render(); break;
      case "set-theme": setTheme(value); break;
      case "set-lang": setLang(value); break;
      case "sort-by-location": sortByLocation(); break;
      case "toggle-start":
        state.showStart = !state.showStart;
        if (!state.showStart) state.startFrom = "";
        render();
        if (state.showStart) {
          var si = document.getElementById("start-from-input");
          if (si) si.focus();
        }
        break;
      case "dismiss-sort-error": state.sortError = null; render(); break;
      case "dismiss-sort-info": state.sortInfo = null; render(); break;
      case "cancel-sort": state.cancelSort = true; state.sortStatus = t("stopping"); render(); break;
      case "show-confirm-clear": state.confirmClear = true; render(); break;
      case "hide-confirm-clear": state.confirmClear = false; render(); break;
      case "clear-delivered": clearDelivered(); break;
      case "reset-route": resetRoute(); break;
      case "select-all": selectAll(); break;
      case "toggle-select": toggleSelected(id); break;
      case "toggle-delivered": toggleDelivered(id); break;
      case "delete-item": deleteItem(id); break;
      case "commit-edit": commitEdit(); break;
      case "move-up": moveItem(id, -1); break;
      case "move-down": moveItem(id, 1); break;
      case "start-position-edit": startPositionEdit(id); break;
      case "start-edit": startEdit(id); break;
      case "move-selected-top": moveSelected("top"); break;
      case "move-selected-bottom": moveSelected("bottom"); break;
      case "move-selected-pos": moveSelected("pos"); break;
      case "mark-selected-delivered": markSelectedDelivered(); break;
      case "delete-selected": deleteSelected(); break;
      case "add-stops": addStops(); break;
    }
  });

  // Keep the text box focused when tapping Delete / Done under it.
  app.addEventListener("mousedown", function (e) {
    if (e.target.closest("[data-edit-actions]")) e.preventDefault();
  });

  // No long-press context menu on stops (long-press is used to drag).
  app.addEventListener("contextmenu", function (e) {
    if (e.target.closest(".row") && !e.target.closest("textarea, input")) e.preventDefault();
  });

  // ---- drag to reorder ----
  // Start by pressing the ⠿ handle, or by holding anywhere on a stop.
  // The list scrolls by itself when you hold a stop near the top/bottom.
  var drag = null;
  var press = null;
  var pressTimer = null;
  var LONG_PRESS_MS = 380;

  function rowEls() {
    return Array.prototype.slice.call(app.querySelectorAll(".row[data-row]"));
  }

  function cancelPress() {
    clearTimeout(pressTimer);
    pressTimer = null;
    press = null;
  }

  app.addEventListener("pointerdown", function (e) {
    if (state.selectMode || state.sorting || drag) return;
    if (state.editingId !== null || state.editingPositionId !== null) return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    var row = e.target.closest(".row[data-row]");
    if (!row) return;
    var handle = e.target.closest("[data-drag-handle]");
    var id = row.getAttribute("data-id");
    if (handle) {
      e.preventDefault();
      startDrag(id, e.clientY);
      return;
    }
    // holding the body of a stop (not a button, link or number) starts a drag
    if (e.target.closest("button, a, input, textarea, .num")) return;
    press = { x: e.clientX, y: e.clientY };
    pressTimer = setTimeout(function () {
      var p = press;
      cancelPress();
      if (p) startDrag(id, p.y);
    }, LONG_PRESS_MS);
  });

  function startDrag(id, clientY) {
    var els = rowEls();
    var idx = -1;
    for (var i = 0; i < els.length; i++) {
      if (els[i].getAttribute("data-id") === id) { idx = i; break; }
    }
    if (idx < 0) return;
    var scrollY = window.pageYOffset;
    var rects = els.map(function (el) {
      var b = el.getBoundingClientRect();
      return { top: b.top + scrollY, height: b.height };
    });
    var el = els[idx];
    drag = {
      id: id,
      idx: idx,
      target: idx,
      els: els,
      rects: rects,
      gap: parseFloat(window.getComputedStyle(el).marginBottom) || 0,
      startPageY: clientY + scrollY,
      clientY: clientY,
      raf: null
    };
    el.classList.add("dragging");
    els.forEach(function (other) { if (other !== el) other.classList.add("shifting"); });
    document.body.classList.add("is-dragging");
    if (navigator.vibrate) { try { navigator.vibrate(15); } catch (err) {} }
    dragFrame();
  }

  // Moves the held stop with the finger and slides the others out of the way.
  function updateDrag() {
    var d = drag;
    if (!d) return;
    var scrollY = window.pageYOffset;
    var r = d.rects[d.idx];
    var dy = (d.clientY + scrollY) - d.startPageY;
    var minDy = d.rects[0].top - r.top;
    var lastRect = d.rects[d.rects.length - 1];
    var maxDy = (lastRect.top + lastRect.height) - (r.top + r.height);
    dy = Math.max(minDy, Math.min(maxDy, dy));
    d.el = d.els[d.idx];
    d.el.style.transform = "translateY(" + dy + "px)";

    var center = r.top + dy + r.height / 2;
    var target = 0;
    for (var i = 0; i < d.rects.length; i++) {
      if (i === d.idx) continue;
      if (d.rects[i].top + d.rects[i].height / 2 < center) target++;
    }
    d.target = target;

    var shift = r.height + d.gap;
    for (var j = 0; j < d.els.length; j++) {
      if (j === d.idx) continue;
      var s = 0;
      if (target > d.idx && j > d.idx && j <= target) s = -shift;
      else if (target < d.idx && j >= target && j < d.idx) s = shift;
      d.els[j].style.transform = s ? "translateY(" + s + "px)" : "";
    }
  }

  // Runs every frame while dragging: auto-scroll near the screen edges.
  function dragFrame() {
    var d = drag;
    if (!d) return;
    var vh = window.innerHeight;
    var topZone = 110, bottomZone = vh - 170;
    var speed = 0;
    if (d.clientY < topZone) speed = -Math.min(22, ((topZone - d.clientY) / topZone) * 26 + 2);
    else if (d.clientY > bottomZone) speed = Math.min(22, ((d.clientY - bottomZone) / 170) * 26 + 2);
    if (speed) window.scrollBy(0, speed);
    updateDrag();
    d.raf = requestAnimationFrame(dragFrame);
  }

  function endDrag() {
    var d = drag;
    if (!d) return;
    cancelAnimationFrame(d.raf);
    drag = null;
    document.body.classList.remove("is-dragging");
    suppressClickUntil = Date.now() + 450;
    if (d.target !== d.idx) {
      var arr = state.items.slice();
      var moved = arr.splice(d.idx, 1)[0];
      arr.splice(d.target, 0, moved);
      state.items = arr;
      saveItems();
    }
    render();
  }

  window.addEventListener("pointermove", function (e) {
    if (press && (Math.abs(e.clientX - press.x) > 8 || Math.abs(e.clientY - press.y) > 8)) cancelPress();
    if (drag) drag.clientY = e.clientY;
  });
  window.addEventListener("pointerup", function () { cancelPress(); endDrag(); });
  window.addEventListener("pointercancel", function () { cancelPress(); endDrag(); });
  // Once a drag has started, stop the page from scrolling under the finger.
  window.addEventListener("touchmove", function (e) {
    if (drag && e.cancelable) e.preventDefault();
  }, { passive: false });

  // ---- keyboard: Enter to commit edit textarea handled via blur ----

  applyTheme();
  applyLang();
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    var onSchemeChange = function () { if (state.theme === "auto") { applyTheme(); render(); } };
    if (mq.addEventListener) mq.addEventListener("change", onSchemeChange);
    else if (mq.addListener) mq.addListener(onSchemeChange);
  }
  render();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
