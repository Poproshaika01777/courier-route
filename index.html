<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#15171A" />
<title>Today's Route</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html, body { margin:0; padding:0; background:#F4F5F2; overscroll-behavior:none; }
  * { box-sizing: border-box; }
  input, textarea, button { font-family: inherit; }
  .bc { font-family: 'Barlow Condensed', system-ui, sans-serif; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

const { useState, useEffect, useRef, useCallback } = React;

const STORAGE_KEY = "courier-route-v1";
const INK = "#15171A", SUB = "#6B7280", PAPER = "#F4F5F2",
      LINE = "#E1E3DE", SAFETY = "#FF6A13", DONE = "#1F8A5F", DANGER = "#D64545";

function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
function todayLabel() {
  return new Date().toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
}
function splitIntoStops(raw) {
  return raw.split(/\n\s*\n+/).map(b => b.trim()).filter(Boolean);
}

// ---- tiny inline icon set (no external icon library needed) ----
const Icon = {
  grip: (p) => <svg {...p} viewBox="0 0 24 24" width={p.size||18} height={p.size||18} fill="none" stroke="currentColor" strokeWidth="2"><circle cx="9" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="18" r="1"/></svg>,
  plus: (p) => <svg {...p} viewBox="0 0 24 24" width={p.size||18} height={p.size||18} fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
  trash: (p) => <svg {...p} viewBox="0 0 24 24" width={p.size||16} height={p.size||16} fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>,
  check: (p) => <svg {...p} viewBox="0 0 24 24" width={p.size||16} height={p.size||16} fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="20 6 9 17 4 12"/></svg>,
  reset: (p) => <svg {...p} viewBox="0 0 24 24" width={p.size||18} height={p.size||18} fill="none" stroke="currentColor" strokeWidth="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-9.5L1 10"/></svg>,
  x: (p) => <svg {...p} viewBox="0 0 24 24" width={p.size||14} height={p.size||14} fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
  list: (p) => <svg {...p} viewBox="0 0 24 24" width={p.size||30} height={p.size||30} fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>,
  checkSquare: (p) => <svg {...p} viewBox="0 0 24 24" width={p.size||20} height={p.size||20} fill="none" stroke="currentColor" strokeWidth="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>,
  square: (p) => <svg {...p} viewBox="0 0 24 24" width={p.size||20} height={p.size||20} fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>,
};

function CourierRoute() {
  const [items, setItems] = useState(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  });
  const [draft, setDraft] = useState("");
  const [confirmClear, setConfirmClear] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [editText, setEditText] = useState("");
  const [selectMode, setSelectMode] = useState(false);
  const [selectedIds, setSelectedIds] = useState(() => new Set());

  const rowRefs = useRef({});
  const dragState = useRef(null);
  const [dragVisual, setDragVisual] = useState(null);

  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); } catch (e) {}
  }, [items]);

  const addStops = useCallback(() => {
    const blocks = splitIntoStops(draft);
    if (blocks.length === 0) return;
    setItems(prev => [...prev, ...blocks.map(text => ({ id: uid(), text, delivered: false }))]);
    setDraft("");
  }, [draft]);

  const toggleDelivered = (id) => setItems(prev => prev.map(it => it.id === id ? { ...it, delivered: !it.delivered } : it));
  const removeItem = (id) => setItems(prev => prev.filter(it => it.id !== id));
  const startEdit = (it) => { setEditingId(it.id); setEditText(it.text); };
  const commitEdit = () => {
    setItems(prev => prev.map(it => it.id === editingId ? { ...it, text: editText.trim() || it.text } : it));
    setEditingId(null);
  };
  const resetRoute = () => { setItems([]); setConfirmClear(false); };
  const clearDelivered = () => { setItems(prev => prev.filter(it => !it.delivered)); setConfirmClear(false); };

  const deliveredCount = items.filter(i => i.delivered).length;
  const pct = items.length ? Math.round((deliveredCount / items.length) * 100) : 0;

  const toggleSelectMode = () => { setSelectMode(v => !v); setSelectedIds(new Set()); };
  const toggleSelected = (id) => setSelectedIds(prev => {
    const next = new Set(prev);
    next.has(id) ? next.delete(id) : next.add(id);
    return next;
  });
  const selectAll = () => setSelectedIds(prev => prev.size === items.length ? new Set() : new Set(items.map(i => i.id)));
  const deleteSelected = () => { setItems(prev => prev.filter(it => !selectedIds.has(it.id))); setSelectedIds(new Set()); setSelectMode(false); };
  const markSelectedDelivered = () => {
    setItems(prev => prev.map(it => selectedIds.has(it.id) ? { ...it, delivered: true } : it));
    setSelectedIds(new Set()); setSelectMode(false);
  };

  const rowHeight = () => {
    const el = rowRefs.current[items[0]?.id];
    return el ? el.getBoundingClientRect().height : 64;
  };

  const onHandlePointerDown = (e, id) => {
    if (selectMode) return;
    e.preventDefault();
    const baseOrder = items.map(i => i.id);
    const baseIndex = baseOrder.indexOf(id);
    dragState.current = { id, baseOrder, baseIndex, startY: e.clientY, currentIndex: baseIndex };
    setDragVisual({ id, offset: 0, active: true });
    window.addEventListener("pointermove", onPointerMove);
    window.addEventListener("pointerup", onPointerUp);
  };

  const onPointerMove = (e) => {
    const ds = dragState.current;
    if (!ds) return;
    const rh = rowHeight();
    const totalOffset = e.clientY - ds.startY;
    const indexDelta = Math.round(totalOffset / rh);
    const newIndex = Math.max(0, Math.min(ds.baseOrder.length - 1, ds.baseIndex + indexDelta));
    if (newIndex !== ds.currentIndex) {
      const order = [...ds.baseOrder];
      order.splice(order.indexOf(ds.id), 1);
      order.splice(newIndex, 0, ds.id);
      ds.currentIndex = newIndex;
      setItems(prev => {
        const map = new Map(prev.map(it => [it.id, it]));
        return order.map(oid => map.get(oid));
      });
    }
    const snappedOffset = (ds.currentIndex - ds.baseIndex) * rh;
    setDragVisual({ id: ds.id, offset: totalOffset - snappedOffset, active: true });
  };

  const onPointerUp = () => {
    dragState.current = null;
    setDragVisual(null);
    window.removeEventListener("pointermove", onPointerMove);
    window.removeEventListener("pointerup", onPointerUp);
  };

  useEffect(() => () => {
    window.removeEventListener("pointermove", onPointerMove);
    window.removeEventListener("pointerup", onPointerUp);
  }, []);

  return (
    <div style={{ fontFamily: "'Inter', system-ui, sans-serif", background: PAPER, minHeight: "100vh", color: INK }}>
      <div style={{ maxWidth: 440, margin: "0 auto", minHeight: "100vh", display: "flex", flexDirection: "column" }}>
        <div style={{ background: INK, color: "#fff", padding: "20px 18px 16px" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
            <div>
              <div className="bc" style={{ fontSize: 13, letterSpacing: 0.3, color: "#9CA0A6" }}>{todayLabel()}</div>
              <div className="bc" style={{ fontSize: 30, fontWeight: 700, lineHeight: 1.05, marginTop: 2 }}>Today's route</div>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={toggleSelectMode} style={{ background: selectMode ? SAFETY : "transparent", border: `1px solid ${selectMode ? SAFETY : "#3A3D42"}`, borderRadius: 8, padding: "8px 10px", color: selectMode ? "#fff" : "#C7C9CC", fontSize: 13 }}>
                {selectMode ? "Done" : "Select"}
              </button>
              <button onClick={() => setConfirmClear(true)} aria-label="Reset route" style={{ background: "transparent", border: "1px solid #3A3D42", borderRadius: 8, padding: 8, color: "#C7C9CC", display: "flex" }}>
                <Icon.reset />
              </button>
            </div>
          </div>
          <div style={{ marginTop: 14 }}>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, color: "#C7C9CC", marginBottom: 6 }}>
              <span>{deliveredCount} of {items.length} delivered</span>
              <span>{pct}%</span>
            </div>
            <div style={{ height: 6, background: "#2A2C30", borderRadius: 3, overflow: "hidden" }}>
              <div style={{ height: "100%", width: `${pct}%`, background: SAFETY, borderRadius: 3, transition: "width 200ms ease" }} />
            </div>
          </div>
        </div>

        {confirmClear && (
          <div style={{ background: "#FFF3EC", borderBottom: `1px solid ${LINE}`, padding: "12px 18px" }}>
            <div style={{ fontSize: 14, marginBottom: 8 }}>Reset today's route?</div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              <button onClick={clearDelivered} style={{ fontSize: 13, padding: "6px 10px", borderRadius: 6, border: `1px solid ${LINE}`, background: "#fff" }}>Remove delivered only</button>
              <button onClick={resetRoute} style={{ fontSize: 13, padding: "6px 10px", borderRadius: 6, border: "none", background: DANGER, color: "#fff" }}>Clear all stops</button>
              <button onClick={() => setConfirmClear(false)} style={{ fontSize: 13, padding: "6px 10px", borderRadius: 6, border: `1px solid ${LINE}`, background: "transparent", marginLeft: "auto" }}><Icon.x /></button>
            </div>
          </div>
        )}

        {selectMode && (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "10px 18px", background: "#fff", borderBottom: `1px solid ${LINE}` }}>
            <button onClick={selectAll} style={{ fontSize: 13, color: SAFETY, background: "none", border: "none", padding: 0 }}>
              {selectedIds.size === items.length && items.length > 0 ? "Deselect all" : "Select all"}
            </button>
            <span style={{ fontSize: 13, color: SUB }}>{selectedIds.size} selected</span>
          </div>
        )}

        <div style={{ flex: 1, paddingBottom: selectMode ? 90 : 150 }}>
          {items.length === 0 && (
            <div style={{ textAlign: "center", color: SUB, padding: "60px 24px" }}>
              <Icon.list style={{ margin: "0 auto 10px", opacity: 0.5 }} />
              <div style={{ fontSize: 15, marginBottom: 4 }}>No stops yet</div>
              <div style={{ fontSize: 13 }}>Paste your addresses below — separate each stop with a blank line — then drag the handle to put them in delivery order.</div>
            </div>
          )}

          {items.map((it, idx) => {
            const isDragging = dragVisual && dragVisual.id === it.id;
            const isSelected = selectedIds.has(it.id);
            return (
              <div key={it.id} ref={el => (rowRefs.current[it.id] = el)}
                style={{
                  display: "flex", alignItems: "flex-start", gap: 10, padding: "12px 14px",
                  background: isDragging ? "#fff" : isSelected ? "#FFF3EC" : "transparent",
                  borderBottom: `1px solid ${LINE}`, position: "relative",
                  transform: isDragging ? `translateY(${dragVisual.offset}px)` : "none",
                  boxShadow: isDragging ? "0 8px 20px rgba(0,0,0,0.15)" : "none",
                  zIndex: isDragging ? 10 : 1, opacity: it.delivered ? 0.55 : 1,
                }}
                onClick={() => selectMode && toggleSelected(it.id)}
              >
                {selectMode ? (
                  <div style={{ padding: 6, color: isSelected ? SAFETY : "#C7C9CC", flexShrink: 0 }}>
                    {isSelected ? <Icon.checkSquare /> : <Icon.square />}
                  </div>
                ) : (
                  <div onPointerDown={(e) => onHandlePointerDown(e, it.id)} style={{ touchAction: "none", color: "#B4B7BB", padding: 6, cursor: "grab", display: "flex", marginTop: 2 }}>
                    <Icon.grip />
                  </div>
                )}

                <div className="bc" style={{ width: 26, height: 26, borderRadius: "50%", background: it.delivered ? DONE : SAFETY, color: "#fff", fontSize: 14, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, marginTop: 2 }}>
                  {idx + 1}
                </div>

                <div style={{ flex: 1, minWidth: 0 }} onClick={(e) => { if (selectMode) return; e.stopPropagation(); if (!it.delivered) startEdit(it); }}>
                  {editingId === it.id ? (
                    <textarea autoFocus value={editText} onChange={(e) => setEditText(e.target.value)} onBlur={commitEdit}
                      rows={Math.min(8, editText.split("\n").length || 1)}
                      style={{ width: "100%", fontSize: 13.5, lineHeight: 1.4, padding: "6px 8px", border: `1px solid ${SAFETY}`, borderRadius: 6, outline: "none", resize: "vertical" }} />
                  ) : (
                    <div style={{ fontSize: 13.5, lineHeight: 1.4, whiteSpace: "pre-line", textDecoration: it.delivered ? "line-through" : "none", color: it.delivered ? SUB : INK }}>
                      {it.text}
                    </div>
                  )}
                </div>

                {!selectMode && (
                  <React.Fragment>
                    <button onClick={(e) => { e.stopPropagation(); toggleDelivered(it.id); }} aria-label="Mark delivered"
                      style={{ width: 30, height: 30, borderRadius: "50%", border: `1.5px solid ${it.delivered ? DONE : "#C7C9CC"}`, background: it.delivered ? DONE : "transparent", color: it.delivered ? "#fff" : "#C7C9CC", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, marginTop: 2 }}>
                      <Icon.check />
                    </button>
                    <button onClick={(e) => { e.stopPropagation(); removeItem(it.id); }} aria-label="Delete stop"
                      style={{ color: "#C7C9CC", padding: 6, display: "flex", flexShrink: 0, marginTop: 2 }}>
                      <Icon.trash />
                    </button>
                  </React.Fragment>
                )}
              </div>
            );
          })}
        </div>

        <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, display: "flex", justifyContent: "center",
          background: selectMode ? "transparent" : "linear-gradient(0deg, #F4F5F2 60%, rgba(244,245,242,0))", paddingTop: selectMode ? 0 : 20 }}>
          {selectMode ? (
            <div style={{ width: "100%", maxWidth: 440, background: INK, padding: "12px 14px", display: "flex", gap: 8 }}>
              <button onClick={markSelectedDelivered} disabled={selectedIds.size === 0}
                style={{ flex: 1, padding: 12, borderRadius: 10, border: "none", background: selectedIds.size === 0 ? "#3A3D42" : DONE, color: "#fff", fontSize: 14, fontWeight: 600, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
                <Icon.check /> Mark delivered
              </button>
              <button onClick={deleteSelected} disabled={selectedIds.size === 0}
                style={{ flex: 1, padding: 12, borderRadius: 10, border: "none", background: selectedIds.size === 0 ? "#3A3D42" : DANGER, color: "#fff", fontSize: 14, fontWeight: 600, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
                <Icon.trash /> Delete
              </button>
            </div>
          ) : (
            <div style={{ width: "100%", maxWidth: 440, padding: "0 14px 14px" }}>
              <div style={{ background: "#fff", border: `1px solid ${LINE}`, borderRadius: 12, padding: "8px 8px 8px 12px", display: "flex", alignItems: "flex-end", gap: 8, boxShadow: "0 4px 14px rgba(0,0,0,0.08)" }}>
                <textarea value={draft} onChange={(e) => setDraft(e.target.value)}
                  placeholder="Paste one or more stops — separate each with a blank line"
                  rows={Math.min(6, Math.max(1, draft.split("\n").length))}
                  style={{ flex: 1, border: "none", outline: "none", resize: "none", fontSize: 14, padding: "6px 0", fontFamily: "inherit", maxHeight: 160, overflowY: "auto" }} />
                <button onClick={addStops} aria-label="Add stop" style={{ width: 36, height: 36, borderRadius: 9, background: SAFETY, color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, border: "none" }}>
                  <Icon.plus />
                </button>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<CourierRoute />);
</script>
</body>
</html>
