<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#15171A" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>Today's Route</title>
<style>
  html, body { margin:0; padding:0; background:#EEF0EC; overscroll-behavior:none; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, Arial, sans-serif; color:#15171A; -webkit-text-size-adjust:100%; }
  body.is-dragging { -webkit-user-select:none; user-select:none; }
  input, textarea, button { font-family: inherit; }
  .bc { font-family: 'Arial Narrow', Arial, sans-serif; font-stretch: condensed; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  textarea { -webkit-appearance: none; }
  #app { max-width: 440px; margin: 0 auto; min-height: 100vh; display:flex; flex-direction:column; }

  /* ---------- header ---------- */
  .header { background:#15171A; color:#fff; padding:calc(16px + env(safe-area-inset-top, 0px)) 16px 14px; border-radius:0 0 20px 20px; }
  .header-top { display:flex; justify-content:space-between; align-items:flex-end; }
  .date { font-size:13px; letter-spacing:.3px; color:#9CA0A6; }
  .title { font-size:29px; font-weight:700; line-height:1.05; margin-top:2px; }
  .counter { text-align:right; line-height:1; }
  .counter .big { font-size:32px; font-weight:700; color:#FF6A13; }
  .counter .of { font-size:18px; color:#9CA0A6; }
  .counter .lbl { font-size:11px; color:#9CA0A6; margin-top:3px; letter-spacing:.3px; }
  .progress-track { height:6px; background:#2A2C30; border-radius:3px; overflow:hidden; margin-top:12px; }
  .progress-fill { height:100%; background:#FF6A13; border-radius:3px; transition:width 200ms ease; }
  .toolbar { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin-top:14px; }
  .tb { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:9px 4px 7px; border-radius:12px; border:1px solid #2F3237; background:#1E2125; color:#D3D5D8; font-size:11.5px; }
  .tb svg { width:18px; height:18px; }
  .tb.on { border-color:#FF6A13; color:#FF9A5C; }
  .tb.active { background:#FF6A13; border-color:#FF6A13; color:#fff; }
  .tb:disabled { opacity:.4; }

  /* ---------- banners ---------- */
  .banner { margin:10px 12px 0; border-radius:12px; padding:10px 12px; font-size:13px; display:flex; align-items:flex-start; gap:8px; }
  .banner button { background:none; border:none; color:#6B7280; flex-shrink:0; padding:2px; display:flex; }
  .banner.info { background:#E6F5ED; border:1px solid #CBE8D7; }
  .banner.error { background:#FFF1E8; border:1px solid #F8D9C4; }
  .banner.confirm { background:#FFF1E8; border:1px solid #F8D9C4; flex-direction:column; align-items:stretch; }
  .confirm-title { font-size:14px; margin-bottom:8px; }
  .confirm-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .confirm-actions button { font-size:13px; padding:8px 12px; border-radius:9px; border:1px solid #E1E3DE; background:#fff; color:#15171A; }
  .confirm-actions .danger { border:none; background:#D64545; color:#fff; }
  .confirm-actions .ghost { margin-left:auto; display:flex; align-items:center; }

  /* ---------- auto-sort card ---------- */
  .sort-card { margin:12px 12px 0; }
  .sort-line { display:flex; gap:8px; }
  .sort-btn { flex:1; padding:13px 12px; border-radius:13px; border:none; background:#FF6A13; color:#fff; font-size:14px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:7px; }
  .sort-btn:disabled { opacity:.85; }
  .cancel-btn { padding:0 16px; border-radius:13px; border:1px solid #D9DCD6; background:#fff; color:#4B5563; font-size:13.5px; flex-shrink:0; }
  .link-btn { background:none; border:none; color:#6B7280; font-size:12.5px; padding:9px 2px 0; text-decoration:underline; text-underline-offset:2px; }
  .start-input { width:100%; padding:11px 12px; border-radius:12px; border:1px solid #D9DCD6; background:#fff; font-size:14px; margin-top:8px; outline:none; }
  .start-input:focus { border-color:#FF6A13; }
  .spinner { width:14px; height:14px; border:2px solid #ffffff55; border-top-color:#fff; border-radius:50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .select-toolbar { display:flex; align-items:center; justify-content:space-between; margin:10px 12px 0; padding:10px 14px; background:#fff; border:1px solid #E3E5E0; border-radius:12px; }
  .select-toolbar button { font-size:13.5px; font-weight:600; color:#FF6A13; background:none; border:none; padding:0; }
  .select-count { font-size:13px; color:#6B7280; }
  .hint { margin:12px 16px 2px; font-size:12px; color:#7B8087; }

  /* ---------- list & rows ---------- */
  .list { flex:1; padding:8px 12px 0; }
  .empty { text-align:center; color:#6B7280; padding:60px 24px; }
  .empty svg { margin:0 auto 10px; opacity:.5; }
  .empty .h { font-size:15px; margin-bottom:4px; }
  .empty .s { font-size:13px; }

  .row { display:flex; align-items:stretch; background:#fff; border:1px solid #E3E5E0; border-radius:14px; margin-bottom:8px; position:relative; touch-action:pan-y; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .row.next { border-color:#FF6A13; box-shadow:0 0 0 1px #FF6A13; }
  .row.delivered { background:#F6F7F5; }
  .row.delivered .body { opacity:.55; }
  .row.selected { background:#FFF3EC; border-color:#FF6A13; }
  .row.shifting { transition: transform .16s ease; }
  .row.dragging { z-index:20; border-color:#FF6A13; box-shadow:0 12px 30px rgba(0,0,0,.25); transition:none; }

  .move-col { display:flex; flex-direction:column; align-items:center; justify-content:space-between; width:40px; padding:4px 0; flex-shrink:0; }
  .move-btn { width:100%; height:26px; display:flex; align-items:center; justify-content:center; color:#A5A9AE; background:none; border:none; padding:0; }
  .move-btn:disabled { opacity:.25; }
  .grip { flex:1; width:100%; min-height:28px; display:flex; align-items:center; justify-content:center; color:#9EA3A9; touch-action:none; cursor:grab; }
  .row.compact .move-btn { display:none; }
  .row.selmode .body { padding-right:14px; }
  .sel-box { width:42px; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#B8BCC0; }
  .sel-box.checked { color:#FF6A13; }

  .body { flex:1; min-width:0; padding:10px 0 10px 2px; }
  .meta { display:flex; align-items:center; gap:7px; margin-bottom:5px; min-height:22px; flex-wrap:wrap; }
  .num { display:inline-flex; align-items:center; justify-content:center; min-width:26px; height:22px; padding:0 8px; border-radius:7px; background:#FF6A13; color:#fff; font-size:14px; font-weight:700; cursor:pointer; }
  .num.done { background:#1F8A5F; }
  .tag-next { font-size:10.5px; font-weight:700; letter-spacing:.6px; color:#FF6A13; }
  .geo-warn { font-size:11.5px; color:#B4530A; }
  .pos-input { width:46px; height:24px; text-align:center; font-size:14px; font-weight:700; border:1.5px solid #FF6A13; border-radius:7px; outline:none; color:#FF6A13; padding:0; }
  .text { font-size:14px; line-height:1.42; white-space:pre-line; word-break:break-word; }
  .text.delivered { text-decoration:line-through; color:#6B7280; }
  .row.compact .text { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; white-space:normal; }
  .phone-link { color:#FF6A13; text-decoration:underline; text-underline-offset:2px; }
  .c-body { padding:8px 0 8px 2px; display:flex; align-items:center; }
  .c-line { display:flex; align-items:center; gap:8px; width:100%; }
  .c-line .text { flex:1; min-width:0; }
  .wa-btn { flex-shrink:0; width:32px; height:32px; border-radius:50%; background:#E6F5ED; color:#157347; display:flex; align-items:center; justify-content:center; text-decoration:none; }
  .wa-pill { display:inline-flex; align-items:center; margin-top:6px; padding:3px 10px; border-radius:999px; background:#E6F5ED; color:#157347; font-size:12px; font-weight:600; text-decoration:none; }

  .edit-box { width:100%; font-size:14px; line-height:1.4; padding:8px 10px; border:1.5px solid #FF6A13; border-radius:10px; outline:none; resize:vertical; -webkit-user-select:text; user-select:text; }
  .edit-actions { display:flex; gap:8px; margin-top:8px; padding-right:2px; }
  .ea { flex:1; padding:10px; border-radius:10px; border:none; font-size:13.5px; font-weight:600; }
  .ea-delete { background:#FDECEC; color:#D64545; }
  .ea-done { background:#15171A; color:#fff; }

  .check-btn { width:48px; flex-shrink:0; border:none; background:none; display:flex; align-items:center; justify-content:center; padding:0; }
  .check-circle { width:32px; height:32px; border-radius:50%; border:2px solid #C9CCD0; display:flex; align-items:center; justify-content:center; color:#C9CCD0; }
  .check-btn.done .check-circle { background:#1F8A5F; border-color:#1F8A5F; color:#fff; }

  /* ---------- bottom area ---------- */
  .bottom-fixed { position:fixed; bottom:0; left:0; right:0; display:flex; flex-direction:column; align-items:center; pointer-events:none; }
  .bottom-fixed > * { pointer-events:auto; }
  .toast { width:calc(100% - 24px); max-width:416px; margin:0 0 10px; background:#15171A; color:#fff; border-radius:13px; padding:10px 8px 10px 14px; display:flex; align-items:center; gap:10px; font-size:13.5px; box-shadow:0 8px 24px rgba(0,0,0,.28); }
  .toast button { margin-left:auto; background:none; border:none; color:#FF8A47; font-weight:700; font-size:14px; padding:6px 10px; }
  .add-wrap { background:linear-gradient(0deg, #EEF0EC 62%, rgba(238,240,236,0)); padding-top:18px; width:100%; display:flex; justify-content:center; }
  .add-inner { width:100%; max-width:440px; padding:0 12px calc(12px + env(safe-area-inset-bottom, 0px)); }
  .add-bar { background:#fff; border:1px solid #DADDD7; border-radius:14px; padding:8px 8px 8px 14px; display:flex; align-items:flex-end; gap:8px; box-shadow:0 4px 16px rgba(0,0,0,.08); }
  .add-bar textarea { flex:1; border:none; outline:none; resize:none; font-size:14px; padding:7px 0; max-height:160px; overflow-y:auto; background:transparent; }
  .add-btn { width:40px; height:40px; border-radius:11px; background:#FF6A13; color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; border:none; }

  .sel-bar { width:100%; max-width:440px; background:#15171A; padding:10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); border-radius:18px 18px 0 0; }
  .sel-row { display:flex; gap:8px; }
  .sel-row + .sel-row { margin-top:8px; }
  .sb { flex:1; padding:12px 6px; border-radius:11px; border:none; color:#fff; font-size:13px; font-weight:600; background:#2A2D32; display:flex; align-items:center; justify-content:center; gap:5px; }
  .sb:disabled { opacity:.4; }
  .sb.deliver { background:#1F8A5F; }
  .sb.del { background:#D64545; }
  .moveto { display:flex; flex:1.5; gap:6px; }
  .moveto input { flex:1; min-width:0; width:100%; padding:0 8px; border-radius:11px; border:1px solid #3A3D42; background:#1E2125; color:#fff; font-size:15px; text-align:center; outline:none; }
  .moveto input:focus { border-color:#FF6A13; }
  .moveto .sb { flex:0 0 auto; padding:12px 14px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "courier-route-v1";
  var svg = {
    grip: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="18" r="1"/></svg>',
    plus: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
    trash: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>',
    check: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>',
    reset: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-9.5L1 10"/></svg>',
    x: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
    list: '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>',
    checkSquare: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
    square: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>',
    copy: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
    pin: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0Z"/><circle cx="12" cy="10" r="3"/></svg>',
    chevUp: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>',
    chevDown: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>',
    chat: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg>',
    rowsCompact: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="10" x2="20" y2="10"/><line x1="4" y1="14" x2="20" y2="14"/><line x1="4" y1="18" x2="20" y2="18"/></svg>',
    rowsFull: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="7" rx="1.5"/><rect x="4" y="13" width="16" height="7" rx="1.5"/></svg>',
    arrowTop: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>',
    arrowBottom: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="5 12 12 19 19 12"/></svg>'
  };

  var state = {
    items: loadItems(),
    draft: "",
    confirmClear: false,
    editingId: null,
    editText: "",
    editingPositionId: null,
    selectMode: false,
    selectedIds: {},
    copyFeedback: false,
    sorting: false,
    sortStatus: "",
    sortError: null,
    sortInfo: null,
    cancelSort: false,
    startFrom: "",
    showStart: false,
    moveTo: "",
    undo: null,
    compact: loadCompact()
  };

  function loadCompact() {
    try { return localStorage.getItem("courier-route-compact") === "1"; } catch (e) { return false; }
  }

  function loadItems() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function saveItems() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.items)); } catch (e) {}
  }
  function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
  function todayLabel() {
    return new Date().toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
  }
  function splitIntoStops(raw) {
    return raw.split(/\n\s*\n+/).map(function (b) { return b.trim(); }).filter(Boolean);
  }
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // Finds phone-number-like sequences in already-escaped text and wraps
  // them in a tappable WhatsApp link. Runs after escapeHtml, so it only
  // ever sees digits/spaces/+/-/()/plain text — safe to inject <a> tags.
  var PHONE_RE = /(\+?\d[\d \t\u00a0\-()]{7,}\d)/g;

  function normalizeToWaNumber(raw) {
    var digits = raw.replace(/\D/g, "");
    if (digits.length === 11 && digits[0] === "8") {
      digits = "7" + digits.slice(1); // KZ/RU local trunk prefix -> country code
    }
    return digits;
  }

  function linkifyPhones(escapedText) {
    return escapedText.replace(PHONE_RE, function (match) {
      var digits = normalizeToWaNumber(match);
      if (digits.length < 9) return match; // too short to be a real phone number
      return '<a href="https://wa.me/' + digits + '" target="_blank" rel="noopener noreferrer" data-phone-link class="phone-link">' + match + '</a>';
    });
  }

  var app = document.getElementById("app");

  // ---- small helpers used by the UI ----
  var undoTimer = null;

  function pushUndo(label) {
    state.undo = { label: label, snap: JSON.stringify(state.items) };
    clearTimeout(undoTimer);
    undoTimer = setTimeout(function () {
      state.undo = null;
      var t = document.getElementById("toast");
      if (t && t.parentNode) t.parentNode.removeChild(t);
    }, 7000);
  }

  function undoLast() {
    if (!state.undo) return;
    try { state.items = JSON.parse(state.undo.snap); } catch (e) {}
    state.undo = null;
    clearTimeout(undoTimer);
    state.selectedIds = {};
    state.selectMode = false;
    state.editingId = null;
    saveItems();
    render();
  }

  function toggleCompact() {
    state.compact = !state.compact;
    try { localStorage.setItem("courier-route-compact", state.compact ? "1" : "0"); } catch (e) {}
    render();
  }

  // First phone number found anywhere in a stop (used for the compact view).
  function firstPhone(text) {
    var m = text.match(/(\+?\d[\d \t\u00a0\-()]{7,}\d)/);
    if (!m) return null;
    var digits = normalizeToWaNumber(m[0]);
    return digits.length >= 9 ? { label: m[0].trim(), digits: digits } : null;
  }

  function tbBtn(action, icon, label, opts) {
    opts = opts || {};
    return '<button class="tb' + (opts.active ? ' active' : '') + (opts.on ? ' on' : '') + '" data-action="' + action + '"' + (opts.disabled ? ' disabled' : '') + '>' + icon + '<span>' + label + '</span></button>';
  }

  function render() {
    if (drag) return; // never rebuild the list in the middle of a drag

    var total = state.items.length;
    var deliveredCount = state.items.filter(function (i) { return i.delivered; }).length;
    var pct = total ? Math.round((deliveredCount / total) * 100) : 0;
    var selectedCount = Object.keys(state.selectedIds).length;
    var allSelected = selectedCount === total && total > 0;
    var nextId = null;
    for (var n = 0; n < state.items.length; n++) {
      if (!state.items[n].delivered) { nextId = state.items[n].id; break; }
    }

    var html = "";

    // ---- header ----
    html += '<div class="header">';
    html += '<div class="header-top">';
    html += '<div><div class="date">' + todayLabel() + '</div><div class="title bc">Today\'s route</div></div>';
    html += '<div class="counter"><span class="big bc">' + deliveredCount + '</span><span class="of bc"> / ' + total + '</span><div class="lbl">delivered</div></div>';
    html += '</div>';
    html += '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>';
    html += '<div class="toolbar">';
    html += tbBtn("copy-list", svg.copy, state.copyFeedback ? "Copied!" : "Copy", { disabled: total === 0 });
    html += tbBtn("toggle-select-mode", svg.checkSquare, state.selectMode ? "Done" : "Select", { active: state.selectMode, disabled: total === 0 && !state.selectMode });
    html += tbBtn("toggle-compact", state.compact ? svg.rowsFull : svg.rowsCompact, state.compact ? "Detailed" : "Compact", { on: state.compact });
    html += tbBtn("show-confirm-clear", svg.reset, "Reset", { disabled: total === 0 });
    html += '</div>';
    html += '</div>';

    // ---- banners ----
    if (state.sortInfo) {
      html += '<div class="banner info"><span style="flex:1">' + escapeHtml(state.sortInfo) + '</span><button data-action="dismiss-sort-info">' + svg.x + '</button></div>';
    }
    if (state.sortError) {
      html += '<div class="banner error"><span style="flex:1">' + escapeHtml(state.sortError) + '</span><button data-action="dismiss-sort-error">' + svg.x + '</button></div>';
    }
    if (state.confirmClear) {
      html += '<div class="banner confirm">';
      html += '<div class="confirm-title">Reset today\'s route?</div>';
      html += '<div class="confirm-actions">';
      html += '<button data-action="clear-delivered">Remove delivered only</button>';
      html += '<button class="danger" data-action="reset-route">Clear all stops</button>';
      html += '<button class="ghost" data-action="hide-confirm-clear">' + svg.x + '</button>';
      html += '</div></div>';
    }

    // ---- auto-sort card ----
    if (!state.selectMode && total > 1) {
      html += '<div class="sort-card">';
      html += '<div class="sort-line"><button class="sort-btn" data-action="sort-by-location"' + (state.sorting ? " disabled" : "") + '>';
      html += state.sorting ? '<span class="spinner"></span> ' + escapeHtml(state.sortStatus) : svg.pin + ' Sort by nearest stop';
      html += '</button>';
      if (state.sorting) html += '<button class="cancel-btn" data-action="cancel-sort">Cancel</button>';
      html += '</div>';
      if (!state.sorting) {
        html += '<button class="link-btn" data-action="toggle-start">' + (state.showStart ? "Use my current location instead" : "Start from an address instead") + '</button>';
      }
      if (state.showStart) {
        html += '<input id="start-from-input" class="start-input" placeholder="Start address, e.g. street and house number" value="' + escapeHtml(state.startFrom) + '"' + (state.sorting ? " disabled" : "") + ' />';
      }
      html += '</div>';
    }

    if (state.selectMode) {
      html += '<div class="select-toolbar">';
      html += '<button data-action="select-all">' + (allSelected ? "Deselect all" : "Select all") + '</button>';
      html += '<span class="select-count">' + selectedCount + ' selected</span>';
      html += '</div>';
    }

    if (!state.selectMode && total > 2) {
      html += '<div class="hint">Hold a stop to drag it · tap its number to jump</div>';
    }

    // ---- list ----
    html += '<div class="list" style="padding-bottom:' + (state.selectMode ? 210 : 170) + 'px">';
    if (total === 0) {
      html += '<div class="empty">' + svg.list + '<div class="h">No stops yet</div><div class="s">Paste your addresses below — separate each stop with a blank line — then hold and drag a stop to put them in delivery order.</div></div>';
    } else {
      state.items.forEach(function (it, idx) {
        var isSelected = !!state.selectedIds[it.id];
        var isNext = it.id === nextId && !state.selectMode;
        var cls = "row" + (isSelected ? " selected" : "") + (it.delivered ? " delivered" : "") + (isNext ? " next" : "") + (state.compact ? " compact" : "") + (state.selectMode ? " selmode" : "");
        html += '<div class="' + cls + '" data-id="' + it.id + '" data-row>';

        if (state.selectMode) {
          html += '<div class="sel-box' + (isSelected ? ' checked' : '') + '" data-action="toggle-select" data-id="' + it.id + '">' + (isSelected ? svg.checkSquare : svg.square) + '</div>';
        } else {
          html += '<div class="move-col">';
          html += '<button class="move-btn" data-action="move-up" data-id="' + it.id + '"' + (idx === 0 ? " disabled" : "") + '>' + svg.chevUp + '</button>';
          html += '<div class="grip" data-drag-handle data-id="' + it.id + '">' + svg.grip + '</div>';
          html += '<button class="move-btn" data-action="move-down" data-id="' + it.id + '"' + (idx === total - 1 ? " disabled" : "") + '>' + svg.chevDown + '</button>';
          html += '</div>';
        }

        var numHtml;
        if (state.editingPositionId === it.id) {
          numHtml = '<input class="pos-input bc" data-position-input data-id="' + it.id + '" type="tel" inputmode="numeric" value="' + (idx + 1) + '" />';
        } else {
          numHtml = '<span class="num bc' + (it.delivered ? ' done' : '') + '"' + (state.selectMode ? '' : ' data-action="start-position-edit" data-id="' + it.id + '"') + '>' + (idx + 1) + '</span>';
        }
        var geoFailed = it.geo && it.geo.failed && it.geo.key === firstLineKey(it.text) && !it.delivered;
        var asCompact = state.compact && state.editingId !== it.id;

        html += '<div class="body' + (asCompact ? ' c-body' : '') + '" data-action="' + (state.selectMode ? 'toggle-select' : 'start-edit') + '" data-id="' + it.id + '">';
        if (asCompact) {
          html += '<div class="c-line">' + numHtml;
          if (geoFailed) html += '<span class="geo-warn">⚠</span>';
          html += '<div class="text' + (it.delivered ? ' delivered' : '') + '">' + escapeHtml(it.text.split("\n")[0].trim()) + '</div>';
          var ph = firstPhone(it.text);
          if (ph && !state.selectMode) {
            html += '<a class="wa-btn" href="https://wa.me/' + ph.digits + '" target="_blank" rel="noopener noreferrer" data-phone-link aria-label="WhatsApp ' + escapeHtml(ph.label) + '">' + svg.chat + '</a>';
          }
          html += '</div>';
        } else {
          html += '<div class="meta">' + numHtml;
          if (isNext) html += '<span class="tag-next">NEXT</span>';
          if (geoFailed) html += '<span class="geo-warn">⚠ not found on map</span>';
          html += '</div>';
          if (state.editingId === it.id) {
            html += '<textarea class="edit-box" data-edit-box rows="' + Math.min(8, Math.max(2, state.editText.split("\n").length)) + '">' + escapeHtml(state.editText) + '</textarea>';
            html += '<div class="edit-actions" data-edit-actions>';
            html += '<button class="ea ea-delete" data-action="delete-item" data-id="' + it.id + '">Delete stop</button>';
            html += '<button class="ea ea-done" data-action="commit-edit">Done</button>';
            html += '</div>';
          } else {
            html += '<div class="text' + (it.delivered ? ' delivered' : '') + '">' + linkifyPhones(escapeHtml(it.text)) + '</div>';
          }
        }
        html += '</div>';

        if (!state.selectMode) {
          html += '<button class="check-btn' + (it.delivered ? ' done' : '') + '" data-action="toggle-delivered" data-id="' + it.id + '" aria-label="Mark delivered"><span class="check-circle">' + svg.check + '</span></button>';
        }
        html += '</div>';
      });
    }
    html += '</div>';

    // ---- bottom area: undo toast + add bar / selection bar ----
    html += '<div class="bottom-fixed">';
    if (state.undo) {
      html += '<div class="toast" id="toast"><span>' + escapeHtml(state.undo.label) + '</span><button data-action="undo">Undo</button></div>';
    }
    if (state.selectMode) {
      var dis = selectedCount === 0 ? " disabled" : "";
      html += '<div class="sel-bar">';
      html += '<div class="sel-row">';
      html += '<button class="sb" data-action="move-selected-top"' + dis + '>' + svg.arrowTop + ' Top</button>';
      html += '<button class="sb" data-action="move-selected-bottom"' + dis + '>' + svg.arrowBottom + ' Bottom</button>';
      html += '<div class="moveto"><input id="move-to-input" type="tel" inputmode="numeric" placeholder="#" value="' + escapeHtml(state.moveTo) + '" /><button class="sb" data-action="move-selected-pos"' + dis + '>Go</button></div>';
      html += '</div>';
      html += '<div class="sel-row">';
      html += '<button class="sb deliver" data-action="mark-selected-delivered"' + dis + '>' + svg.check + ' Delivered</button>';
      html += '<button class="sb del" data-action="delete-selected"' + dis + '>' + svg.trash + ' Delete</button>';
      html += '</div>';
      html += '</div>';
    } else {
      html += '<div class="add-wrap"><div class="add-inner"><div class="add-bar">';
      html += '<textarea id="draft-input" placeholder="Paste one or more stops — separate each with a blank line" rows="' + Math.min(6, Math.max(1, state.draft.split("\n").length)) + '">' + escapeHtml(state.draft) + '</textarea>';
      html += '<button class="add-btn" data-action="add-stops" aria-label="Add stops">' + svg.plus + '</button>';
      html += '</div></div></div>';
    }
    html += '</div>';

    app.innerHTML = html;

    // ---- wire up inputs that live outside the click delegation ----
    if (state.editingId !== null) {
      var eb = app.querySelector("[data-edit-box]");
      if (eb) {
        eb.focus();
        eb.setSelectionRange(eb.value.length, eb.value.length);
        eb.addEventListener("input", function () { state.editText = eb.value; });
        eb.addEventListener("blur", commitEdit);
      }
    }
    var draftInput = document.getElementById("draft-input");
    if (draftInput) {
      draftInput.addEventListener("input", function () {
        state.draft = draftInput.value;
        draftInput.rows = Math.min(6, Math.max(1, state.draft.split("\n").length));
      });
    }
    var startFromInput = document.getElementById("start-from-input");
    if (startFromInput) {
      startFromInput.addEventListener("input", function () { state.startFrom = startFromInput.value; });
    }
    var moveToInput = document.getElementById("move-to-input");
    if (moveToInput) {
      moveToInput.addEventListener("input", function () { state.moveTo = moveToInput.value; });
    }
    var posInput = app.querySelector("[data-position-input]");
    if (posInput) {
      posInput.focus();
      posInput.select();
      var posId = posInput.getAttribute("data-id");
      posInput.addEventListener("blur", function () { commitPositionEdit(posId, posInput.value); });
      posInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") posInput.blur();
      });
    }
  }

  function moveSelected(where) {
    var ids = state.selectedIds;
    var sel = state.items.filter(function (it) { return ids[it.id]; });
    if (!sel.length) return;
    var rest = state.items.filter(function (it) { return !ids[it.id]; });
    var at;
    if (where === "top") {
      at = 0;
    } else if (where === "bottom") {
      at = rest.length;
    } else {
      var input = document.getElementById("move-to-input");
      var n = parseInt(input ? input.value : state.moveTo, 10);
      if (!n || isNaN(n)) {
        state.sortError = "Type the position you want first (for example 3), then tap Go.";
        render();
        return;
      }
      at = Math.max(0, Math.min(rest.length, n - 1));
    }
    var label = "Moved " + sel.length + " stop" + (sel.length === 1 ? "" : "s") +
      (where === "top" ? " to the top" : where === "bottom" ? " to the bottom" : " to position " + (at + 1));
    pushUndo(label);
    state.items = rest.slice(0, at).concat(sel, rest.slice(at));
    state.selectedIds = {};
    state.selectMode = false;
    state.moveTo = "";
    saveItems();
    render();
  }

  // ---- actions ----
  function addStops() {
    var blocks = splitIntoStops(state.draft);
    if (blocks.length === 0) return;
    blocks.forEach(function (text) {
      state.items.push({ id: uid(), text: text, delivered: false });
    });
    state.draft = "";
    saveItems();
    render();
  }

  function toggleDelivered(id) {
    state.items = state.items.map(function (it) {
      return it.id === id ? Object.assign({}, it, { delivered: !it.delivered }) : it;
    });
    saveItems();
    render();
  }

  function deleteItem(id) {
    pushUndo("Stop deleted");
    state.items = state.items.filter(function (it) { return it.id !== id; });
    state.editingId = null;
    saveItems();
    render();
  }

  function startEdit(id) {
    if (state.editingId === id) return;
    if (state.editingId !== null) commitEdit();
    var it = state.items.find(function (i) { return i.id === id; });
    if (!it) return;
    state.editingId = id;
    state.editText = it.text;
    render();
  }

  function commitEdit() {
    if (state.editingId === null) return;
    state.items = state.items.map(function (it) {
      return it.id === state.editingId ? Object.assign({}, it, { text: state.editText.trim() || it.text }) : it;
    });
    state.editingId = null;
    saveItems();
    render();
  }

  function moveItem(id, delta) {
    var index = state.items.findIndex(function (it) { return it.id === id; });
    if (index === -1) return;
    var newIndex = Math.max(0, Math.min(state.items.length - 1, index + delta));
    if (newIndex === index) return;
    var arr = state.items.slice();
    var moved = arr.splice(index, 1)[0];
    arr.splice(newIndex, 0, moved);
    state.items = arr;
    saveItems();
    render();
  }

  function startPositionEdit(id) {
    state.editingPositionId = id;
    render();
  }

  function commitPositionEdit(id, rawValue) {
    state.editingPositionId = null;
    var index = state.items.findIndex(function (it) { return it.id === id; });
    if (index === -1) { render(); return; }
    var target = parseInt(rawValue, 10);
    if (!target || isNaN(target)) { render(); return; }
    var newIndex = Math.max(0, Math.min(state.items.length - 1, target - 1));
    if (newIndex === index) { render(); return; }
    var arr = state.items.slice();
    var moved = arr.splice(index, 1)[0];
    arr.splice(newIndex, 0, moved);
    state.items = arr;
    saveItems();
    render();
  }

  function buildNumberedText() {
    return state.items
      .map(function (it, idx) { return (idx + 1) + ".\n" + it.text; })
      .join("\n\n");
  }

  function showCopyFeedback() {
    state.copyFeedback = true;
    render();
    setTimeout(function () {
      state.copyFeedback = false;
      render();
    }, 1500);
  }

  function copyList() {
    if (state.items.length === 0) return;
    var text = buildNumberedText();

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(showCopyFeedback).catch(function () {
        fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
      document.execCommand("copy");
      showCopyFeedback();
    } catch (e) {
      window.prompt("Copy this text manually:", text);
    }
    document.body.removeChild(ta);
  }

  function resetRoute() {
    pushUndo("Route cleared");
    state.items = [];
    state.confirmClear = false;
    saveItems();
    render();
  }

  function clearDelivered() {
    pushUndo("Delivered stops removed");
    state.items = state.items.filter(function (it) { return !it.delivered; });
    state.confirmClear = false;
    saveItems();
    render();
  }

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function getCurrentPosition() {
    return new Promise(function (resolve, reject) {
      if (!navigator.geolocation) { reject(new Error("no geolocation")); return; }
      navigator.geolocation.getCurrentPosition(
        function (pos) { resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }); },
        function (err) { reject(err); },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
      );
    });
  }

  function haversineKm(a, b) {
    var R = 6371;
    var dLat = (b.lat - a.lat) * Math.PI / 180;
    var dLon = (b.lon - a.lon) * Math.PI / 180;
    var lat1 = a.lat * Math.PI / 180, lat2 = b.lat * Math.PI / 180;
    var x = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.sin(dLon / 2) * Math.sin(dLon / 2) * Math.cos(lat1) * Math.cos(lat2);
    return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
  }

  function reverseGeocodeCity(coords) {
    var url = "https://nominatim.openstreetmap.org/reverse?format=json&lat=" + coords.lat + "&lon=" + coords.lon;
    return fetch(url, { headers: { "Accept-Language": "ru" } })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        var addr = data && data.address;
        if (!addr) return "";
        var city = addr.city || addr.town || addr.village || addr.state || "";
        var country = addr.country || "";
        return [city, country].filter(Boolean).join(", ");
      })
      .catch(function () { return ""; });
  }

  // Pulls out "street name + house number" fragments from a messy first
  // line like "ЖК La Verde, Жамакаева 252, блок7, кв 88" so the geocoder
  // gets something closer to a real postal address instead of the whole
  // noisy line. Tolerates a comma between name and number, and a "дом"
  // marker, and skips false hits like "подъезд 1" or "этаж 6".
  var BLOCKLIST_WORDS = ["подъезд", "этаж", "кв", "квартира", "блок", "корпус", "код", "домофон", "калитка", "калитки", "этаже", "офис"];
  var STREET_NUM_RE = /([А-ЯЁ][А-Яа-яЁё\-]*(?:\s+[А-ЯЁ][А-Яа-яЁё\-]*)*)\s*,?\s*(?:дом\s+|д\.\s*)?(\d+[a-zA-Zа-яА-Я]?(?:\/\d+)?)/g;

  function extractQueryCandidates(fullText) {
    var firstLine = fullText.split("\n")[0].trim();
    var candidates = [];
    var m;
    STREET_NUM_RE.lastIndex = 0;
    while ((m = STREET_NUM_RE.exec(firstLine)) !== null) {
      var words = m[1].trim().split(/\s+/);
      var lastWord = words[words.length - 1].toLowerCase();
      if (BLOCKLIST_WORDS.indexOf(lastWord) !== -1) continue;
      var candidate = (m[1] + " " + m[2]).trim();
      if (candidate !== firstLine) candidates.push(candidate);
    }
    candidates.push(firstLine);
    return candidates;
  }

  function geocodeAddress(fullText, cityHint) {
    var candidates = extractQueryCandidates(fullText);

    function tryCandidate(i) {
      if (i >= candidates.length) return Promise.resolve(null);
      var query = cityHint ? candidates[i] + ", " + cityHint : candidates[i];
      var url = "https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=3&q=" + encodeURIComponent(query);
      return fetch(url, { headers: { "Accept-Language": "ru" } })
        .then(function (res) { return res.json(); })
        .then(function (results) {
          if (results && results.length) {
            // Prefer a result that actually matched a house number over
            // a loose match on just the street/area name.
            var best = results.find(function (r) { return r.address && r.address.house_number; }) || results[0];
            return { lat: parseFloat(best.lat), lon: parseFloat(best.lon) };
          }
          if (i + 1 < candidates.length) {
            return sleep(1100).then(function () { return tryCandidate(i + 1); });
          }
          return null;
        })
        .catch(function () {
          if (i + 1 < candidates.length) {
            return sleep(1100).then(function () { return tryCandidate(i + 1); });
          }
          return null;
        });
    }

    return tryCandidate(0);
  }

  function getOrigin() {
    var startText = (state.startFrom || "").trim();
    if (!startText) {
      state.sortStatus = "Getting your location…";
      render();
      return getCurrentPosition();
    }
    state.sortStatus = "Locating start point…";
    render();
    return geocodeAddress(startText, "").then(function (coords) {
      if (!coords) {
        var err = new Error("start-not-found");
        err.code = "start-not-found";
        throw err;
      }
      return coords;
    });
  }

  function firstLineKey(text) { return text.split("\n")[0].trim(); }

  // A stop keeps its map position once found, so re-sorting is instant.
  // The saved position is only reused while its address line is unchanged.
  function cachedCoords(it) {
    if (it.geo && !it.geo.failed && it.geo.key === firstLineKey(it.text)) {
      return { lat: it.geo.lat, lon: it.geo.lon };
    }
    return null;
  }

  function setGeo(id, geo) {
    state.items = state.items.map(function (it) {
      return it.id === id ? Object.assign({}, it, { geo: geo }) : it;
    });
    saveItems();
  }

  function pathLengthKm(origin, route) {
    var total = 0, cur = origin;
    for (var i = 0; i < route.length; i++) {
      total += haversineKm(cur, route[i].coords);
      cur = route[i].coords;
    }
    return total;
  }

  function nearestNeighbor(origin, stops) {
    var remaining = stops.slice();
    var route = [];
    var current = origin;
    while (remaining.length) {
      var bestIdx = 0, bestDist = Infinity;
      for (var i = 0; i < remaining.length; i++) {
        var d = haversineKm(current, remaining[i].coords);
        if (d < bestDist) { bestDist = d; bestIdx = i; }
      }
      var chosen = remaining.splice(bestIdx, 1)[0];
      route.push(chosen);
      current = chosen.coords;
    }
    return route;
  }

  // 2-opt: keep reversing stretches of the route while that makes the whole
  // trip shorter. Fixes the "zig-zag" mistakes nearest-neighbour leaves behind.
  // The start point stays fixed and the route ends wherever it ends.
  function twoOpt(origin, route) {
    var best = route.slice();
    var improved = true, rounds = 0;
    while (improved && rounds < 60) {
      improved = false;
      rounds++;
      for (var i = 0; i < best.length - 1; i++) {
        for (var j = i + 1; j < best.length; j++) {
          var prev = i === 0 ? origin : best[i - 1].coords;
          var a = best[i].coords, b = best[j].coords;
          var next = j + 1 < best.length ? best[j + 1].coords : null;
          var before = haversineKm(prev, a) + (next ? haversineKm(b, next) : 0);
          var after = haversineKm(prev, b) + (next ? haversineKm(a, next) : 0);
          if (after < before - 1e-9) {
            best = best.slice(0, i).concat(best.slice(i, j + 1).reverse(), best.slice(j + 1));
            improved = true;
          }
        }
      }
    }
    return best;
  }

  function applyOrder(origin) {
    var pending = state.items.filter(function (it) { return !it.delivered; });
    var delivered = state.items.filter(function (it) { return it.delivered; });
    var located = [], unlocated = [];
    pending.forEach(function (it) {
      var c = cachedCoords(it);
      if (c) located.push({ item: it, coords: c }); else unlocated.push(it);
    });

    var route = twoOpt(origin, nearestNeighbor(origin, located));
    var km = pathLengthKm(origin, route);

    pushUndo("Route sorted");
    state.items = route.map(function (r) { return r.item; }).concat(unlocated, delivered);
    state.sorting = false;
    state.sortStatus = "";
    state.sortInfo = "Sorted " + route.length + " stop" + (route.length === 1 ? "" : "s") +
      " · about " + km.toFixed(1) + " km in a straight line from the start" +
      (delivered.length ? ". Delivered stops moved to the bottom." : ".");
    if (unlocated.length) {
      state.sortError = unlocated.length + (unlocated.length > 1 ? " stops couldn't be found on the map and were" : " stop couldn't be found on the map and was") +
        " put after the sorted ones (marked ⚠). Drag or move " + (unlocated.length > 1 ? "them" : "it") + " into place manually.";
    }
    saveItems();
    render();
  }

  function sortByLocation() {
    if (state.sorting) return;
    var pendingCount = state.items.filter(function (it) { return !it.delivered; }).length;
    if (pendingCount < 2) {
      state.sortError = "You need at least 2 undelivered stops to sort.";
      render();
      return;
    }
    state.sorting = true;
    state.cancelSort = false;
    state.sortError = null;
    state.sortInfo = null;
    render();

    function finishCancelled() {
      state.sorting = false;
      state.sortStatus = "";
      state.sortInfo = "Sorting cancelled. Locations found so far are saved, so the next sort will be faster.";
      render();
    }

    var usedStartAddress = !!(state.startFrom || "").trim();

    getOrigin().then(function (origin) {
      if (state.cancelSort) { finishCancelled(); return; }

      var toLocate = state.items.filter(function (it) { return !it.delivered && !cachedCoords(it); });

      var cityStep = Promise.resolve("");
      if (toLocate.length) {
        state.sortStatus = "Checking your area…";
        render();
        cityStep = (usedStartAddress ? sleep(1100) : Promise.resolve())
          .then(function () { return reverseGeocodeCity(origin); })
          .then(function (city) { return sleep(1100).then(function () { return city; }); });
      }

      return cityStep.then(function (city) {
        function next(i) {
          if (i >= toLocate.length || state.cancelSort) return Promise.resolve();
          state.sortStatus = "Locating stop " + (i + 1) + " of " + toLocate.length + "…";
          render();
          var it = toLocate[i];
          var key = firstLineKey(it.text);
          return geocodeAddress(it.text, city).then(function (coords) {
            setGeo(it.id, coords ? { key: key, lat: coords.lat, lon: coords.lon } : { key: key, failed: true });
            if (i + 1 >= toLocate.length) return next(i + 1);
            return sleep(1100).then(function () { return next(i + 1); });
          });
        }

        return next(0).then(function () {
          if (state.cancelSort) { finishCancelled(); return; }
          state.sortStatus = "Working out the best order…";
          render();
          applyOrder(origin);
        });
      });
    }).catch(function (err) {
      state.sorting = false;
      state.sortStatus = "";
      if (err && err.code === "start-not-found") {
        state.sortError = "Couldn't find that starting address. Try just the street name and house number, or clear the field to use your current location instead.";
      } else {
        state.sortError = "Couldn't get your location or reach the map service. Check that location access is allowed and you're online, then try again.";
      }
      render();
    });
  }

  function toggleSelectMode() {
    state.selectMode = !state.selectMode;
    state.selectedIds = {};
    render();
  }

  function toggleSelected(id) {
    if (state.selectedIds[id]) delete state.selectedIds[id];
    else state.selectedIds[id] = true;
    render();
  }

  function selectAll() {
    var allSelected = Object.keys(state.selectedIds).length === state.items.length && state.items.length > 0;
    if (allSelected) {
      state.selectedIds = {};
    } else {
      state.selectedIds = {};
      state.items.forEach(function (it) { state.selectedIds[it.id] = true; });
    }
    render();
  }

  function deleteSelected() {
    var count = Object.keys(state.selectedIds).length;
    pushUndo(count + " stop" + (count === 1 ? "" : "s") + " deleted");
    state.items = state.items.filter(function (it) { return !state.selectedIds[it.id]; });
    state.selectedIds = {};
    state.selectMode = false;
    saveItems();
    render();
  }

  function markSelectedDelivered() {
    var count = Object.keys(state.selectedIds).length;
    pushUndo(count + " stop" + (count === 1 ? "" : "s") + " marked delivered");
    state.items = state.items.map(function (it) {
      return state.selectedIds[it.id] ? Object.assign({}, it, { delivered: true }) : it;
    });
    state.selectedIds = {};
    state.selectMode = false;
    saveItems();
    render();
  }

  // ---- click delegation ----
  var suppressClickUntil = 0;

  app.addEventListener("click", function (e) {
    if (Date.now() < suppressClickUntil) return;        // click that ends a drag
    if (e.target.closest("[data-phone-link]")) return;  // let WhatsApp links open
    if (e.target.closest("[data-edit-box]")) return;    // taps inside the text box
    var t = e.target.closest("[data-action]");
    if (!t) return;
    var action = t.getAttribute("data-action");
    var id = t.getAttribute("data-id");
    switch (action) {
      case "toggle-select-mode": toggleSelectMode(); break;
      case "toggle-compact": toggleCompact(); break;
      case "copy-list": copyList(); break;
      case "undo": undoLast(); break;
      case "sort-by-location": sortByLocation(); break;
      case "toggle-start":
        state.showStart = !state.showStart;
        if (!state.showStart) state.startFrom = "";
        render();
        if (state.showStart) {
          var si = document.getElementById("start-from-input");
          if (si) si.focus();
        }
        break;
      case "dismiss-sort-error": state.sortError = null; render(); break;
      case "dismiss-sort-info": state.sortInfo = null; render(); break;
      case "cancel-sort": state.cancelSort = true; state.sortStatus = "Stopping…"; render(); break;
      case "show-confirm-clear": state.confirmClear = true; render(); break;
      case "hide-confirm-clear": state.confirmClear = false; render(); break;
      case "clear-delivered": clearDelivered(); break;
      case "reset-route": resetRoute(); break;
      case "select-all": selectAll(); break;
      case "toggle-select": toggleSelected(id); break;
      case "toggle-delivered": toggleDelivered(id); break;
      case "delete-item": deleteItem(id); break;
      case "commit-edit": commitEdit(); break;
      case "move-up": moveItem(id, -1); break;
      case "move-down": moveItem(id, 1); break;
      case "start-position-edit": startPositionEdit(id); break;
      case "start-edit": startEdit(id); break;
      case "move-selected-top": moveSelected("top"); break;
      case "move-selected-bottom": moveSelected("bottom"); break;
      case "move-selected-pos": moveSelected("pos"); break;
      case "mark-selected-delivered": markSelectedDelivered(); break;
      case "delete-selected": deleteSelected(); break;
      case "add-stops": addStops(); break;
    }
  });

  // Keep the text box focused when tapping Delete / Done under it.
  app.addEventListener("mousedown", function (e) {
    if (e.target.closest("[data-edit-actions]")) e.preventDefault();
  });

  // No long-press context menu on stops (long-press is used to drag).
  app.addEventListener("contextmenu", function (e) {
    if (e.target.closest(".row") && !e.target.closest("textarea, input")) e.preventDefault();
  });

  // ---- drag to reorder ----
  // Start by pressing the ⠿ handle, or by holding anywhere on a stop.
  // The list scrolls by itself when you hold a stop near the top/bottom.
  var drag = null;
  var press = null;
  var pressTimer = null;
  var LONG_PRESS_MS = 380;

  function rowEls() {
    return Array.prototype.slice.call(app.querySelectorAll(".row[data-row]"));
  }

  function cancelPress() {
    clearTimeout(pressTimer);
    pressTimer = null;
    press = null;
  }

  app.addEventListener("pointerdown", function (e) {
    if (state.selectMode || state.sorting || drag) return;
    if (state.editingId !== null || state.editingPositionId !== null) return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    var row = e.target.closest(".row[data-row]");
    if (!row) return;
    var handle = e.target.closest("[data-drag-handle]");
    var id = row.getAttribute("data-id");
    if (handle) {
      e.preventDefault();
      startDrag(id, e.clientY);
      return;
    }
    // holding the body of a stop (not a button, link or number) starts a drag
    if (e.target.closest("button, a, input, textarea, .num")) return;
    press = { x: e.clientX, y: e.clientY };
    pressTimer = setTimeout(function () {
      var p = press;
      cancelPress();
      if (p) startDrag(id, p.y);
    }, LONG_PRESS_MS);
  });

  function startDrag(id, clientY) {
    var els = rowEls();
    var idx = -1;
    for (var i = 0; i < els.length; i++) {
      if (els[i].getAttribute("data-id") === id) { idx = i; break; }
    }
    if (idx < 0) return;
    var scrollY = window.pageYOffset;
    var rects = els.map(function (el) {
      var b = el.getBoundingClientRect();
      return { top: b.top + scrollY, height: b.height };
    });
    var el = els[idx];
    drag = {
      id: id,
      idx: idx,
      target: idx,
      els: els,
      rects: rects,
      gap: parseFloat(window.getComputedStyle(el).marginBottom) || 0,
      startPageY: clientY + scrollY,
      clientY: clientY,
      raf: null
    };
    el.classList.add("dragging");
    els.forEach(function (other) { if (other !== el) other.classList.add("shifting"); });
    document.body.classList.add("is-dragging");
    if (navigator.vibrate) { try { navigator.vibrate(15); } catch (err) {} }
    dragFrame();
  }

  // Moves the held stop with the finger and slides the others out of the way.
  function updateDrag() {
    var d = drag;
    if (!d) return;
    var scrollY = window.pageYOffset;
    var r = d.rects[d.idx];
    var dy = (d.clientY + scrollY) - d.startPageY;
    var minDy = d.rects[0].top - r.top;
    var lastRect = d.rects[d.rects.length - 1];
    var maxDy = (lastRect.top + lastRect.height) - (r.top + r.height);
    dy = Math.max(minDy, Math.min(maxDy, dy));
    d.el = d.els[d.idx];
    d.el.style.transform = "translateY(" + dy + "px)";

    var center = r.top + dy + r.height / 2;
    var target = 0;
    for (var i = 0; i < d.rects.length; i++) {
      if (i === d.idx) continue;
      if (d.rects[i].top + d.rects[i].height / 2 < center) target++;
    }
    d.target = target;

    var shift = r.height + d.gap;
    for (var j = 0; j < d.els.length; j++) {
      if (j === d.idx) continue;
      var s = 0;
      if (target > d.idx && j > d.idx && j <= target) s = -shift;
      else if (target < d.idx && j >= target && j < d.idx) s = shift;
      d.els[j].style.transform = s ? "translateY(" + s + "px)" : "";
    }
  }

  // Runs every frame while dragging: auto-scroll near the screen edges.
  function dragFrame() {
    var d = drag;
    if (!d) return;
    var vh = window.innerHeight;
    var topZone = 110, bottomZone = vh - 170;
    var speed = 0;
    if (d.clientY < topZone) speed = -Math.min(22, ((topZone - d.clientY) / topZone) * 26 + 2);
    else if (d.clientY > bottomZone) speed = Math.min(22, ((d.clientY - bottomZone) / 170) * 26 + 2);
    if (speed) window.scrollBy(0, speed);
    updateDrag();
    d.raf = requestAnimationFrame(dragFrame);
  }

  function endDrag() {
    var d = drag;
    if (!d) return;
    cancelAnimationFrame(d.raf);
    drag = null;
    document.body.classList.remove("is-dragging");
    suppressClickUntil = Date.now() + 450;
    if (d.target !== d.idx) {
      var arr = state.items.slice();
      var moved = arr.splice(d.idx, 1)[0];
      arr.splice(d.target, 0, moved);
      state.items = arr;
      saveItems();
    }
    render();
  }

  window.addEventListener("pointermove", function (e) {
    if (press && (Math.abs(e.clientX - press.x) > 8 || Math.abs(e.clientY - press.y) > 8)) cancelPress();
    if (drag) drag.clientY = e.clientY;
  });
  window.addEventListener("pointerup", function () { cancelPress(); endDrag(); });
  window.addEventListener("pointercancel", function () { cancelPress(); endDrag(); });
  // Once a drag has started, stop the page from scrolling under the finger.
  window.addEventListener("touchmove", function (e) {
    if (drag && e.cancelable) e.preventDefault();
  }, { passive: false });

  // ---- keyboard: Enter to commit edit textarea handled via blur ----

  render();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
